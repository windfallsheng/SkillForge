*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{background:linear-gradient(180deg,var(--bg) 12%,var(--bg2) 135%);color:var(--text);font-family:system-ui,'Segoe UI',Roboto,sans-serif;overflow:hidden;position:relative}

/* ═══ 舞台与八套模板（html[data-template] 决定渲染哪套；模板管布局、主题管配色，80 种组合） ═══ */
.stage{height:100svh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;overflow:hidden}
.serif{font-family:Georgia,'Songti SC','SimSun',serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace}

/* 1. classic 经典舞台：徽章 + 渐变巨字 + 分隔线 + 金句 + 三列要点卡 */
.tpl-classic{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:min(60%,1200px);height:100%;padding:6vh 0}
.tpl-classic .badge{font-size:12px;letter-spacing:3px;color:var(--accent);margin-bottom:22px}
.tpl-classic h1{font-size:clamp(40px,5vw,64px);line-height:1.2;font-weight:800;letter-spacing:2px;background:var(--title-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:18px;text-shadow:0 0 40px var(--glow)}
.tpl-classic .divider{width:64px;height:2px;background:var(--title-grad);border-radius:2px;margin:0 auto 26px}
.tpl-classic .quote{font-size:22px;font-style:italic;color:var(--text);line-height:1.8;margin-bottom:40px}
.tpl-classic .quote::before{content:"「";color:var(--accent)}
.tpl-classic .quote::after{content:"」";color:var(--accent)}
.tpl-classic ul.points{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:44px;text-align:left;width:100%}
.tpl-classic ul.points li{display:flex;align-items:flex-start;gap:12px;font-size:16px;line-height:1.7;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:18px 16px}
.tpl-classic .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--glow);flex:none;margin-top:8px}

/* 2. minimal 极简留白：瑞士平面，左上小标 + 衬线巨字 + 细线 + 编号竖排要点 */
.tpl-minimal{display:flex;flex-direction:column;justify-content:center;text-align:left;width:min(74%,1200px);height:100%;padding:6vh 0}
.tpl-minimal .badge{font-size:11px;letter-spacing:4px;color:var(--muted);margin-bottom:30px;display:flex;align-items:center;gap:14px}
.tpl-minimal .badge::before{content:'';width:28px;height:1px;background:var(--accent)}
.tpl-minimal h1{font-family:Georgia,'Songti SC','SimSun',serif;font-weight:700;font-size:clamp(42px,5.4vw,70px);line-height:1.28;color:var(--text);margin-bottom:36px}
.tpl-minimal .rule{width:100%;height:1px;background:var(--border);margin-bottom:30px}
.tpl-minimal .quote{font-size:18px;font-style:italic;color:var(--muted);line-height:1.8;margin-bottom:40px}
.tpl-minimal ol.points{list-style:none;display:flex;flex-direction:column;gap:20px;margin-bottom:50px}
.tpl-minimal ol.points li{display:flex;align-items:baseline;gap:24px;font-size:17px;line-height:1.6;color:var(--text)}
.tpl-minimal .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--accent);letter-spacing:1px;flex:none}
.tpl-minimal .meta{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 3. magazine 杂志社论：刊头通栏线 + 左文右栏 + 首字下沉金句 */
.tpl-magazine{display:flex;flex-direction:column;justify-content:center;width:min(78%,1200px);height:100%;padding:6vh 0}
.tpl-magazine .masthead{display:flex;align-items:center;gap:16px;font-size:11px;letter-spacing:3px;color:var(--muted);padding-bottom:14px;border-bottom:2px solid var(--text);margin-bottom:36px}
.tpl-magazine .masthead::after{content:'';flex:1;height:1px;background:var(--border)}
.tpl-magazine .cols{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
.tpl-magazine h1{font-family:Georgia,'Songti SC','SimSun',serif;font-weight:700;font-size:clamp(36px,4.4vw,54px);line-height:1.32;color:var(--text);margin-bottom:24px}
.tpl-magazine .quote{font-size:17px;line-height:1.95;color:var(--muted);font-style:italic}
.tpl-magazine .quote::first-letter{font-size:46px;float:left;line-height:.85;margin:4px 10px 0 0;color:var(--accent);font-family:Georgia,serif;font-style:normal;font-weight:700}
.tpl-magazine ul.points{list-style:none;display:flex;flex-direction:column;gap:20px;border-left:1px solid var(--border);padding-left:26px}
.tpl-magazine ul.points li{display:flex;gap:14px;font-size:16px;line-height:1.65;color:var(--text)}
.tpl-magazine .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--accent);padding-top:3px;flex:none}
.tpl-magazine .footbar{margin-top:40px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 4. hero 巨幕：电影海报式巨型关键词 + 底部要点横条 */
.tpl-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;padding:6vh 8vw;position:relative}
.tpl-hero .badge{font-size:12px;letter-spacing:4px;color:var(--accent);margin-bottom:28px}
.tpl-hero h1{font-size:clamp(56px,10vw,140px);font-weight:900;letter-spacing:6px;line-height:1.06;background:var(--title-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:28px;text-shadow:0 0 60px var(--glow)}
.tpl-hero .quote{font-size:20px;letter-spacing:2px;color:var(--text);opacity:.92;margin-bottom:8vh}
.tpl-hero ul.points{list-style:none;display:flex;gap:16px;width:min(84%,1100px)}
.tpl-hero ul.points li{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:16px 14px;font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:8px;text-align:left}
.tpl-hero .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--accent);letter-spacing:1px}
.tpl-hero footer{position:absolute;bottom:4.5vh;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 5. timeline 时间叙事：中央竖线 + 节点圆点 + 要点左右交替卡片 */
.tpl-timeline{display:flex;flex-direction:column;justify-content:center;width:min(76%,1100px);height:100%;padding:6vh 0}
.tpl-timeline .head{text-align:center;margin-bottom:8vh}
.tpl-timeline h1{font-size:clamp(34px,4.2vw,50px);font-weight:800;background:var(--title-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px}
.tpl-timeline .quote{font-size:16px;font-style:italic;color:var(--muted)}
.tpl-timeline .track{position:relative;width:100%}
.tpl-timeline .track::before{content:'';position:absolute;left:50%;top:2%;bottom:2%;width:2px;transform:translateX(-50%);background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:.5}
.tpl-timeline .row{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;margin-bottom:24px;position:relative}
.tpl-timeline .mid{display:flex;justify-content:center;grid-column:2;grid-row:1;z-index:1}
.tpl-timeline .dot{width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);box-shadow:0 0 16px var(--glow)}
.tpl-timeline .card{grid-column:1;grid-row:1;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 20px;font-size:15px;line-height:1.65;text-align:right}
.tpl-timeline .row:nth-child(odd) .card{grid-column:3;text-align:left}
.tpl-timeline .card .num{display:block;font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:4px}
.tpl-timeline footer{text-align:center;margin-top:5vh;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 6. grid 卡片栅格：标题区 + 2×2 大圆角卡片（编号描边角标 + 渐变顶条） */
.tpl-grid{display:flex;flex-direction:column;justify-content:center;width:min(80%,1200px);height:100%;padding:6vh 0}
.tpl-grid .head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:5vh}
.tpl-grid h1{font-size:clamp(38px,4.6vw,56px);font-weight:800;background:var(--title-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.tpl-grid .quote{font-size:15px;font-style:italic;color:var(--muted);text-align:right;max-width:42%;line-height:1.7}
.tpl-grid .cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.tpl-grid .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px 26px 24px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;min-height:150px}
.tpl-grid .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.85}
.tpl-grid .card.wide{grid-column:1/-1;min-height:110px}
.tpl-grid .card .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;font-weight:700;color:transparent;-webkit-text-stroke:1px var(--accent);line-height:1}
.tpl-grid .card .t{font-size:16px;line-height:1.65;color:var(--text)}
.tpl-grid footer{margin-top:4vh;text-align:center;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 7. dashboard 数据仪表：KPI 环形图 + 要点进度条 + 右栏标题金句 */
.tpl-dash{display:grid;grid-template-columns:320px 1fr;gap:56px;align-items:center;width:min(82%,1200px);height:100%;padding:6vh 0}
.tpl-dash .kpi{display:flex;flex-direction:column;align-items:center;gap:30px}
.tpl-dash .ring{width:190px;height:190px;border-radius:50%;background:conic-gradient(var(--accent) 0 82%,var(--panel-solid) 82% 100%);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 44px var(--glow-soft)}
.tpl-dash .ring::after{content:'';position:absolute;inset:15px;border-radius:50%;background:var(--bg)}
.tpl-dash .val{position:relative;z-index:1;font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:44px;font-weight:700;color:var(--text)}
.tpl-dash .lab{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:2px;color:var(--muted);z-index:1}
.tpl-dash .bars{display:flex;flex-direction:column;gap:20px;width:100%}
.tpl-dash .bar .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:var(--text)}
.tpl-dash .bar .row .pct{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent)}
.tpl-dash .bar .track{height:10px;background:var(--panel-solid);border:1px solid var(--border);border-radius:99px;overflow:hidden}
.tpl-dash .bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tpl-dash .side h1{font-size:clamp(34px,4.2vw,50px);font-weight:800;line-height:1.3;margin-bottom:16px;color:var(--text)}
.tpl-dash .side .quote{font-size:17px;font-style:italic;color:var(--muted);line-height:1.8;margin-bottom:24px}
.tpl-dash .side .extra{list-style:none;display:flex;flex-direction:column;gap:12px}
.tpl-dash .side .extra li{display:flex;gap:12px;font-size:15px;color:var(--text);align-items:baseline}
.tpl-dash .side .extra .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--accent)}
.tpl-dash .side .foot{margin-top:28px;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 8. brutalist 新粗野：撞色块 + 4px 粗框 + 8px 硬阴影 + 零圆角 */
.tpl-brutal{display:flex;flex-direction:column;justify-content:center;gap:28px;width:min(80%,1100px);height:100%;padding:6vh 0}
.tpl-brutal .badge{align-self:flex-start;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--bg);background:var(--accent);padding:6px 16px;border:4px solid var(--text);box-shadow:6px 6px 0 var(--accent2)}
.tpl-brutal h1{font-size:clamp(44px,6.4vw,80px);font-weight:900;line-height:1.08;color:var(--bg);background:var(--text);padding:12px 28px;align-self:flex-start;border:4px solid var(--text);box-shadow:10px 10px 0 var(--accent)}
.tpl-brutal .quote{font-size:18px;font-weight:600;line-height:1.75;border-left:10px solid var(--accent2);padding-left:20px;max-width:88%}
.tpl-brutal ul.points{list-style:none;display:flex;flex-wrap:wrap;gap:16px}
.tpl-brutal ul.points li{font-size:15px;font-weight:700;padding:12px 20px;background:var(--panel-solid);border:4px solid var(--text);box-shadow:6px 6px 0 var(--accent2)}
.tpl-brutal ul.points li .num{margin-right:10px;font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent)}
.tpl-brutal footer{font-size:11px;font-weight:700;letter-spacing:2px;border-top:4px solid var(--text);padding-top:14px;display:flex;justify-content:space-between;align-items:center;color:var(--text)}


/* 9. swiss 瑞士国际主义：严格左对齐网格 + 超大无衬线标题 + 底部信息通栏 */
.tpl-swiss{display:flex;flex-direction:column;justify-content:center;width:min(82%,1100px);height:100%;padding:6vh 0;text-align:left}
.tpl-swiss .badge{font-size:11px;font-weight:700;letter-spacing:4px;color:var(--accent);margin-bottom:3.5vh;display:flex;align-items:center;gap:14px}
.tpl-swiss .badge::before{content:'';width:36px;height:3px;background:var(--accent)}
.tpl-swiss h1{font-size:clamp(46px,6.4vw,82px);font-weight:900;line-height:1.06;letter-spacing:-1px;color:var(--text);margin-bottom:3vh}
.tpl-swiss .rule{width:100%;height:2px;background:var(--text);margin-bottom:3vh;position:relative}
.tpl-swiss .rule::after{content:'';position:absolute;right:0;top:0;width:18%;height:2px;background:var(--accent)}
.tpl-swiss .quote{font-size:17px;line-height:1.8;color:var(--muted);margin-bottom:4vh;max-width:72%}
.tpl-swiss ul.points{list-style:none;display:flex;gap:28px;margin-bottom:5vh}
.tpl-swiss ul.points li{flex:1;font-size:14px;line-height:1.7;color:var(--text);border-top:1px solid var(--border);padding-top:14px}
.tpl-swiss ul.points li .num{display:block;font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--accent);margin-bottom:8px}
.tpl-swiss footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 10. bauhaus 包豪斯：几何元素（圆/方/三角）+ 三原色块 + 粗黑线 */
.tpl-bauhaus{display:flex;flex-direction:column;justify-content:center;width:min(82%,1100px);height:100%;padding:6vh 0;position:relative}
.tpl-bauhaus .geo{position:absolute;top:8vh;right:3vw;display:flex;gap:18px;align-items:flex-end;opacity:.92}
.tpl-bauhaus .geo .c{width:60px;height:60px;border-radius:50%;background:var(--accent)}
.tpl-bauhaus .geo .s{width:46px;height:46px;background:var(--accent2);transform:rotate(24deg)}
.tpl-bauhaus .geo .t{width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:46px solid var(--accent)}
.tpl-bauhaus .badge{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--bg);background:var(--accent);padding:6px 14px;align-self:flex-start;margin-bottom:3.5vh}
.tpl-bauhaus h1{font-size:clamp(42px,5.8vw,74px);font-weight:900;line-height:1.1;color:var(--text);margin-bottom:3vh;max-width:78%}
.tpl-bauhaus .quote{font-size:16px;line-height:1.8;color:var(--muted);margin-bottom:4vh;max-width:60%}
.tpl-bauhaus ul.points{list-style:none;display:flex;gap:18px;margin-bottom:5vh}
.tpl-bauhaus ul.points li{flex:1;font-size:15px;line-height:1.7;color:var(--text);background:var(--panel-solid);padding:16px 14px;border-top:6px solid var(--accent)}
.tpl-bauhaus ul.points li:nth-child(2){border-top-color:var(--accent2)}
.tpl-bauhaus ul.points li .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;color:var(--accent);margin-right:8px}
.tpl-bauhaus .footbar{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:4px solid var(--text);font-size:10px;letter-spacing:2px;color:var(--muted)}
.tpl-bauhaus .footbar::before{content:'';width:60px;height:12px;background:var(--accent2)}

/* 11. mondrian 蒙德里安：黑粗线网格 + 红黄蓝色块填充 */
.tpl-mondrian{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:1fr auto;gap:10px;width:min(84%,1150px);height:88%;background:var(--panel-solid);border:8px solid var(--text)}
.tpl-mondrian .cell{position:relative;overflow:hidden}
.tpl-mondrian .main{grid-row:1;grid-column:1;display:flex;flex-direction:column;justify-content:center;padding:4vh 3vw}
.tpl-mondrian .side{grid-row:1/3;grid-column:2;background:var(--accent);display:flex;flex-direction:column;justify-content:center;padding:3vh 2vw}
.tpl-mondrian .band{grid-row:2;grid-column:1;background:var(--accent2);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.tpl-mondrian .badge{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:2vh}
.tpl-mondrian h1{font-size:clamp(36px,4.6vw,60px);font-weight:900;line-height:1.15;color:var(--text);margin-bottom:2vh}
.tpl-mondrian .quote{font-size:15px;line-height:1.8;color:var(--muted)}
.tpl-mondrian .side ul{list-style:none;display:flex;flex-direction:column;gap:16px}
.tpl-mondrian .side li{font-size:14px;font-weight:700;line-height:1.6;color:var(--bg);display:flex;gap:10px;align-items:flex-start}
.tpl-mondrian .side .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;font-size:13px;color:var(--bg);border:2px solid var(--bg);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none}
.tpl-mondrian .band .lab{font-size:11px;letter-spacing:2px;color:var(--bg);font-weight:700}
.tpl-mondrian .band .v{font-size:13px;font-weight:900;color:var(--bg)}

/* 12. editorial 编辑刊：刊头通栏双线 + 首字下沉 + 左右双栏 */
.tpl-editorial{display:flex;flex-direction:column;justify-content:center;width:min(80%,1150px);height:100%;padding:5vh 0}
.tpl-editorial .masthead{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--text);border-bottom:1px solid var(--text);padding:12px 0;margin-bottom:4vh;font-size:11px;letter-spacing:3px;color:var(--muted)}
.tpl-editorial .masthead b{font-size:15px;color:var(--text);letter-spacing:4px}
.tpl-editorial .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:6vw;margin-bottom:4vh}
.tpl-editorial h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:clamp(38px,4.4vw,56px);font-weight:700;line-height:1.28;color:var(--text);margin-bottom:2.5vh}
.tpl-editorial h1::first-letter{font-size:1.9em;color:var(--accent);float:left;line-height:.9;margin:4px 10px 0 0;font-weight:900}
.tpl-editorial .quote{font-size:16px;line-height:1.9;color:var(--muted);font-style:italic}
.tpl-editorial ul.points{list-style:none;display:flex;flex-direction:column;gap:18px}
.tpl-editorial ul.points li{display:flex;gap:14px;font-size:15px;line-height:1.7;color:var(--text);padding-bottom:14px;border-bottom:1px solid var(--border)}
.tpl-editorial ul.points li:last-child{border-bottom:none}
.tpl-editorial .num{font-family:Georgia,serif;font-size:30px;font-weight:900;color:var(--accent);line-height:1;flex:none}
.tpl-editorial .footbar{display:flex;justify-content:space-between;border-top:3px double var(--text);padding-top:14px;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 13. typo 大字报：巨型标题撑满 + 底部要点三列 */
.tpl-typo{display:flex;flex-direction:column;justify-content:flex-end;width:min(88%,1200px);height:100%;padding:6vh 2vw 5vh;text-align:left}
.tpl-typo .badge{font-size:11px;letter-spacing:4px;color:var(--accent);margin-bottom:2vh}
.tpl-typo h1{font-size:clamp(60px,9.2vw,128px);font-weight:900;line-height:.97;letter-spacing:-2px;color:var(--text);margin-bottom:2.5vh}
.tpl-typo .quote{font-size:16px;line-height:1.8;color:var(--muted);margin-bottom:4vh;max-width:60%}
.tpl-typo ul.points{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:4vh;border-top:2px solid var(--text);padding-top:18px}
.tpl-typo ul.points li{font-size:14px;line-height:1.7;color:var(--text)}
.tpl-typo ul.points li .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;color:var(--accent);margin-right:8px}
.tpl-typo footer{font-size:10px;letter-spacing:2px;color:var(--muted);display:flex;justify-content:space-between}

/* 14. memphis 孟菲斯：波点底纹 + 撞色徽章 + 卡片微斜错落 */
.tpl-memphis{display:flex;flex-direction:column;justify-content:center;width:min(84%,1150px);height:100%;padding:6vh 0;position:relative}
.tpl-memphis .dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(var(--border) 3px,transparent 3px);background-size:44px 44px;opacity:.6}
.tpl-memphis .badge{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:2px;color:var(--bg);background:var(--accent);padding:8px 16px;border-radius:999px;margin-bottom:3.5vh;transform:rotate(-2deg)}
.tpl-memphis h1{font-size:clamp(42px,5.6vw,70px);font-weight:900;line-height:1.1;color:var(--text);margin-bottom:3vh}
.tpl-memphis .quote{font-size:16px;line-height:1.8;color:var(--muted);margin-bottom:4vh;max-width:66%}
.tpl-memphis ul.points{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:5vh}
.tpl-memphis ul.points li{font-size:15px;line-height:1.7;color:var(--text);background:var(--panel-solid);border:3px solid var(--text);border-radius:14px;padding:18px 16px;display:flex;gap:12px;align-items:flex-start}
.tpl-memphis ul.points li:nth-child(odd){transform:rotate(-1.2deg)}
.tpl-memphis ul.points li:nth-child(even){transform:rotate(1.2deg);background:var(--tag-bg)}
.tpl-memphis .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;font-size:15px;color:var(--accent);background:var(--bg);border-radius:8px;padding:4px 8px;flex:none}
.tpl-memphis footer{font-size:11px;letter-spacing:2px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}

/* 15. exhibit 展览海报：展签卡片（白卡黑框硬影微斜）+ 大标题 + 底注 */
.tpl-exhibit{display:flex;flex-direction:column;justify-content:center;width:min(82%,1150px);height:100%;padding:6vh 0;position:relative}
.tpl-exhibit .wall-label{position:absolute;top:6vh;right:0;font-size:10px;letter-spacing:3px;color:var(--muted);writing-mode:vertical-rl}
.tpl-exhibit .title-block{display:flex;align-items:baseline;gap:20px;margin-bottom:3vh}
.tpl-exhibit .title-block h1{font-size:clamp(42px,5.4vw,68px);font-weight:800;line-height:1.12;color:var(--text)}
.tpl-exhibit .title-block .yr{font-family:Georgia,serif;font-size:20px;font-style:italic;color:var(--accent)}
.tpl-exhibit .quote{font-size:16px;line-height:1.8;color:var(--muted);margin-bottom:4vh;max-width:70%}
.tpl-exhibit .label-card{background:var(--panel-solid);border:3px solid var(--text);padding:24px 26px;box-shadow:10px 10px 0 var(--accent);transform:rotate(-.6deg);margin-bottom:5vh}
.tpl-exhibit .label-card .lab{font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:14px;font-weight:700}
.tpl-exhibit .label-card ul{list-style:none;display:flex;gap:24px;flex-wrap:wrap}
.tpl-exhibit .label-card li{flex:1;min-width:180px;font-size:14px;line-height:1.7;color:var(--text)}
.tpl-exhibit .label-card .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent);font-weight:800;margin-right:8px}
.tpl-exhibit footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 16. window 荷兰视窗：不对称 2:1 网格 + 色块开窗 */
.tpl-window{display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:1.2fr 1fr;gap:14px;width:min(84%,1150px);height:86%;padding:4vh 0}
.tpl-window .win{overflow:hidden;position:relative}
.tpl-window .w-main{grid-column:1;grid-row:1/3;background:var(--panel-solid);border:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;padding:5vh 3vw}
.tpl-window .w-top{grid-column:2;grid-row:1;background:var(--accent);display:flex;flex-direction:column;justify-content:center;padding:3vh 2vw}
.tpl-window .w-bottom{grid-column:2;grid-row:2;border:3px solid var(--text);background:var(--bg2);display:flex;flex-direction:column;justify-content:center;padding:3vh 2vw}
.tpl-window .badge{font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:2.5vh}
.tpl-window h1{font-size:clamp(34px,4.2vw,54px);font-weight:900;line-height:1.15;color:var(--text);margin-bottom:3vh}
.tpl-window .w-main ul{list-style:none;display:flex;flex-direction:column;gap:14px}
.tpl-window .w-main li{font-size:14px;line-height:1.65;color:var(--text);display:flex;gap:10px;align-items:baseline}
.tpl-window .w-main .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--accent);font-weight:800}
.tpl-window .w-top .k{font-size:11px;letter-spacing:2px;color:var(--bg);font-weight:700;margin-bottom:12px}
.tpl-window .w-top .v{font-size:clamp(18px,2.2vw,28px);font-weight:900;color:var(--bg);line-height:1.4}
.tpl-window .w-bottom .v{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:16px}
.tpl-window .w-bottom footer{font-size:9px;letter-spacing:1px;color:var(--muted)}


/* 17. newspaper 报纸头版：报头 + 通栏大标题 + 双栏细排 */
.tpl-newspaper{display:flex;flex-direction:column;width:min(88%,1150px);height:100%;padding:4vh 0}
.tpl-newspaper .mast{text-align:center;border-top:4px double var(--text);border-bottom:1px solid var(--text);padding:1.5vh 0;margin-bottom:2.5vh}
.tpl-newspaper .mast h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:clamp(28px,3.4vw,44px);font-weight:900;letter-spacing:2px;color:var(--text)}
.tpl-newspaper .mast .meta{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:5px;display:flex;justify-content:center;gap:16px}
.tpl-newspaper .headline{font-family:Georgia,'Songti SC','SimSun',serif;font-size:clamp(30px,3.6vw,48px);font-weight:800;line-height:1.25;color:var(--text);border-bottom:3px solid var(--text);padding-bottom:1.5vh;margin-bottom:2vh}
.tpl-newspaper .cols{columns:2;column-gap:3vw;column-rule:1px solid var(--border)}
.tpl-newspaper .lead{font-size:15px;line-height:1.85;color:var(--muted);margin-bottom:2vh;break-inside:avoid}
.tpl-newspaper .lead::first-letter{font-size:2.6em;float:left;line-height:.85;margin:3px 8px 0 0;color:var(--accent);font-family:Georgia,serif;font-weight:900}
.tpl-newspaper ul.points{list-style:none}
.tpl-newspaper ul.points li{font-size:13px;line-height:1.75;color:var(--text);padding:7px 0;border-top:1px dotted var(--border);break-inside:avoid;display:flex;gap:8px}
.tpl-newspaper ul.points .num{font-family:Georgia,serif;color:var(--accent);font-weight:800;flex:none}
.tpl-newspaper footer{display:flex;justify-content:space-between;border-top:2px solid var(--text);margin-top:auto;padding-top:10px;font-size:9px;letter-spacing:2px;color:var(--muted)}

/* 18. popart 波普艺术：半色调网点 + 粗描边硬影 + 撞色块 */
.tpl-popart{display:flex;flex-direction:column;justify-content:center;width:min(84%,1150px);height:100%;position:relative;padding:6vh 0}
.tpl-popart .halftone{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(var(--border) 2px,transparent 2px);background-size:16px 16px;opacity:.5}
.tpl-popart .badge{align-self:flex-start;font-size:13px;font-weight:900;letter-spacing:2px;color:var(--bg);background:var(--accent);padding:8px 18px;border:3px solid var(--text);box-shadow:5px 5px 0 var(--text);margin-bottom:3.5vh;transform:rotate(-1.5deg)}
.tpl-popart h1{font-size:clamp(46px,6vw,84px);font-weight:900;line-height:1.05;color:var(--bg);-webkit-text-stroke:2.5px var(--text);margin-bottom:2.5vh;text-shadow:4px 4px 0 var(--accent)}
.tpl-popart .quote{font-size:16px;font-weight:800;color:var(--text);background:var(--tag-bg);border:3px solid var(--text);padding:12px 18px;margin-bottom:4vh;box-shadow:6px 6px 0 var(--accent2)}
.tpl-popart ul.points{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.tpl-popart ul.points li{font-size:15px;font-weight:800;color:var(--bg);background:var(--accent2);border:3px solid var(--text);padding:14px 16px;box-shadow:5px 5px 0 var(--text);display:flex;gap:10px;align-items:center}
.tpl-popart ul.points li:nth-child(even){background:var(--accent)}
.tpl-popart ul.points .num{font-family:ui-monospace,'SF Mono',Menlo,monospace;background:var(--bg);color:var(--text);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.tpl-popart footer{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:4vh}

/* 19. opart 欧普艺术：放射线视错觉 + 同心框核心 */
.tpl-opart{display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:relative;overflow:hidden}
.tpl-opart .rays{position:absolute;inset:-40%;pointer-events:none;background:repeating-conic-gradient(var(--text) 0deg 3deg,transparent 3deg 10deg);opacity:.22}
.tpl-opart .core{position:relative;width:min(78%,1050px);background:var(--panel-solid);border:2px solid var(--text);padding:6vh 4vw;text-align:center;box-shadow:0 0 0 12px var(--bg2),0 0 0 14px var(--text)}
.tpl-opart .badge{font-size:11px;letter-spacing:5px;color:var(--accent);margin-bottom:2.5vh}
.tpl-opart h1{font-size:clamp(38px,5vw,64px);font-weight:900;letter-spacing:1px;color:var(--text);margin-bottom:2.5vh;line-height:1.15}
.tpl-opart .quote{font-size:15px;color:var(--muted);margin-bottom:3.5vh}
.tpl-opart ul.points{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 28px}
.tpl-opart ul.points li{font-size:14px;color:var(--text);display:flex;align-items:center;gap:8px}
.tpl-opart ul.points .num{width:22px;height:22px;border:2px solid var(--text);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--text)}
.tpl-opart footer{margin-top:3.5vh;font-size:10px;letter-spacing:3px;color:var(--muted)}

/* 20. artnouveau 新艺术：慕夏拱形 + 双线内衬 + 卷草装饰 */
.tpl-artnouveau{display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(80%,1050px);height:100%;text-align:center;padding:5vh 0}
.tpl-artnouveau .arch{position:relative;width:100%;border:2px solid var(--accent);border-radius:46% 46% 0 0 / 22% 22% 0 0;padding:7vh 5vw 4vh;background:var(--panel)}
.tpl-artnouveau .arch::after{content:'';position:absolute;inset:12px;border:1px solid var(--border);border-radius:inherit;pointer-events:none}
.tpl-artnouveau .ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:3vh;color:var(--accent);font-size:16px}
.tpl-artnouveau .ornament::before,.tpl-artnouveau .ornament::after{content:'';height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--accent))}
.tpl-artnouveau .ornament::after{background:linear-gradient(90deg,var(--accent),transparent)}
.tpl-artnouveau .badge{font-size:11px;letter-spacing:6px;color:var(--accent2);margin-bottom:2.5vh}
.tpl-artnouveau h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:clamp(36px,4.6vw,58px);font-weight:700;color:var(--text);margin-bottom:2vh;line-height:1.3}
.tpl-artnouveau .quote{font-size:15px;font-style:italic;color:var(--muted);margin-bottom:4vh;max-width:72%;margin-left:auto;margin-right:auto}
.tpl-artnouveau ul.points{list-style:none;display:flex;justify-content:center;gap:3vw;flex-wrap:wrap;margin-bottom:4vh}
.tpl-artnouveau ul.points li{font-size:14px;color:var(--text);line-height:1.8}
.tpl-artnouveau ul.points .num{font-family:Georgia,serif;font-size:15px;font-style:italic;color:var(--accent);margin-right:8px}
.tpl-artnouveau footer{font-size:10px;letter-spacing:3px;color:var(--muted);display:flex;gap:24px}

/* 21. acid 酸性设计：液态金属 blob + 荧光斜切徽章（风格本体色特许：金属灰，经 color-mix 混入主题强调色） */
.tpl-acid{display:flex;flex-direction:column;justify-content:center;width:min(82%,1100px);height:100%;padding:6vh 0;position:relative}
.tpl-acid .liquid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 42%,var(--border) 46%,transparent 52%),repeating-linear-gradient(90deg,var(--border) 0 1px,transparent 1px 90px);opacity:.8}
.tpl-acid .blob{position:absolute;top:8%;right:6%;width:min(24vw,190px);height:min(24vw,190px);border-radius:58% 42% 55% 45% / 48% 55% 45% 52%;background:conic-gradient(from 210deg,color-mix(in srgb,rgba(180,180,170,.9) 80%,var(--accent) 20%),color-mix(in srgb,rgba(70,70,80,.9) 80%,var(--accent) 20%),color-mix(in srgb,rgba(220,220,210,.9) 80%,var(--accent) 20%),color-mix(in srgb,rgba(90,90,100,.9) 80%,var(--accent) 20%),color-mix(in srgb,rgba(180,180,170,.9) 80%,var(--accent) 20%));box-shadow:inset 0 0 24px rgba(0,0,0,.35);opacity:.85}
.tpl-acid .badge{font-size:12px;font-weight:900;letter-spacing:3px;color:var(--bg);background:var(--accent);padding:7px 16px;border-radius:2px;transform:skewX(-12deg);margin-bottom:3vh;align-self:flex-start}
.tpl-acid h1{font-size:clamp(44px,5.8vw,76px);font-weight:900;line-height:1.02;letter-spacing:-1px;color:var(--text);margin-bottom:2.5vh}
.tpl-acid .quote{font-size:15px;color:var(--muted);margin-bottom:4vh;max-width:70%;border-left:4px solid var(--accent);padding-left:16px}
.tpl-acid ul.points{list-style:none;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4vh}
.tpl-acid ul.points li{font-size:14px;font-weight:800;color:var(--text);background:var(--panel-solid);border:1.5px solid var(--border);border-radius:2px;padding:10px 14px;display:flex;gap:8px;align-items:center;transform:skewX(-6deg)}
.tpl-acid ul.points li>*{transform:skewX(6deg)}
.tpl-acid ul.points .num{color:var(--accent);font-family:ui-monospace,'SF Mono',Menlo,monospace}
.tpl-acid footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted);border-top:1px dashed var(--border);padding-top:12px}

/* 22. glitch 故障艺术：RGB 错位标题 + 阶梯裁切卡（风格本体色特许：品红/青错位影，经 color-mix 混入主题强调色） */
.tpl-glitch{display:flex;flex-direction:column;justify-content:center;width:min(84%,1150px);height:100%;padding:6vh 0;position:relative}
.tpl-glitch .bars{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 18px,color-mix(in srgb,var(--accent) 6%,transparent) 18px 21px,color-mix(in srgb,var(--accent2) 6%,transparent) 21px 24px)}
.tpl-glitch .badge{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:3px;color:var(--accent);border:1.5px solid var(--accent);padding:5px 12px;margin-bottom:3vh;align-self:flex-start}
.tpl-glitch h1{position:relative;font-size:clamp(44px,6vw,80px);font-weight:900;line-height:1.05;color:var(--text);margin-bottom:3vh}
.tpl-glitch h1::before,.tpl-glitch h1::after{content:attr(data-t);position:absolute;inset:0;opacity:.7}
.tpl-glitch h1::before{color:color-mix(in srgb,#f0f 78%,var(--accent) 22%);transform:translate(-3px,2px);clip-path:inset(12% 0 58% 0)}
.tpl-glitch h1::after{color:color-mix(in srgb,#0ff 78%,var(--accent2) 22%);transform:translate(3px,-2px);clip-path:inset(58% 0 12% 0)}
.tpl-glitch .quote{font-size:15px;color:var(--muted);margin-bottom:4vh;max-width:70%;font-family:ui-monospace,'SF Mono',Menlo,monospace}
.tpl-glitch ul.points{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:4vh}
.tpl-glitch ul.points li{font-size:14px;color:var(--text);background:var(--panel-solid);border:1px solid var(--border);padding:12px 14px;display:flex;gap:10px;align-items:baseline;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.tpl-glitch ul.points .num{font-family:ui-monospace,'SF Mono',Menlo,monospace;color:var(--accent);font-weight:800}
.tpl-glitch footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted);font-family:ui-monospace,'SF Mono',Menlo,monospace}

/* 23. vaporwave 蒸汽波：落日渐变 + 透视网格地平线（风格本体色特许：粉紫地平线，经 color-mix 混入主题强调色） */
.tpl-vaporwave{display:flex;flex-direction:column;justify-content:flex-end;width:min(86%,1150px);height:100%;padding:7vh 0 6vh;position:relative}
.tpl-vaporwave .sun{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:min(34vw,260px);height:min(34vw,260px);border-radius:50%;background:linear-gradient(180deg,var(--accent2),transparent 62%);opacity:.55;pointer-events:none}
.tpl-vaporwave .grid{position:absolute;bottom:0;left:0;right:0;height:42%;pointer-events:none;background:linear-gradient(180deg,transparent,color-mix(in srgb,rgba(180,80,255,.28) 76%,var(--accent) 24%)),repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 1px,transparent 1px 34px);transform:perspective(340px) rotateX(58deg);transform-origin:bottom}
.tpl-vaporwave .badge{font-size:12px;letter-spacing:5px;color:var(--bg);background:linear-gradient(90deg,var(--accent),var(--accent2));padding:7px 18px;border-radius:999px;margin-bottom:3vh;align-self:flex-start}
.tpl-vaporwave h1{font-size:clamp(40px,5.4vw,70px);font-weight:900;line-height:1.1;letter-spacing:1px;color:var(--text);margin-bottom:2.5vh}
.tpl-vaporwave .quote{font-size:15px;color:var(--muted);margin-bottom:4vh;max-width:64%}
.tpl-vaporwave ul.points{list-style:none;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4vh}
.tpl-vaporwave ul.points li{font-size:14px;color:var(--text);border:1.5px solid var(--border);border-radius:10px;padding:10px 16px;background:var(--panel)}
.tpl-vaporwave ul.points .num{color:var(--accent);font-family:Georgia,serif;font-style:italic;margin-right:8px}
.tpl-vaporwave footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:3px;color:var(--muted)}

/* 24. cyber 赛博朋克：霓虹切角框 + 扫描线 + 发光标题 */
.tpl-cyber{display:flex;flex-direction:column;justify-content:center;width:min(82%,1100px);height:100%;padding:6vh 0;position:relative}
.tpl-cyber .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 26px,var(--glow-soft) 26px 27px)}
.tpl-cyber .frame{position:relative;border:1.5px solid var(--accent);padding:5vh 4vw;background:var(--panel);clip-path:polygon(0 14px,14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.tpl-cyber .frame::after{content:'';position:absolute;top:-6px;left:-6px;right:-6px;bottom:-6px;border:1.5px solid var(--border);clip-path:inherit;pointer-events:none}
.tpl-cyber .frame::before{content:'';position:absolute;top:0;left:0;width:40%;height:1.5px;background:var(--accent);box-shadow:0 0 12px var(--glow)}
.tpl-cyber .badge{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:2.5vh}
.tpl-cyber h1{font-size:clamp(38px,5vw,64px);font-weight:900;line-height:1.1;color:var(--text);margin-bottom:2.5vh;text-shadow:0 0 18px var(--glow)}
.tpl-cyber .quote{font-size:15px;color:var(--muted);margin-bottom:3.5vh}
.tpl-cyber ul.points{list-style:none;display:flex;flex-wrap:wrap;gap:12px;margin-bottom:3.5vh}
.tpl-cyber ul.points li{font-size:14px;color:var(--text);border-left:3px solid var(--accent);padding:6px 0 6px 12px;flex:1;min-width:200px}
.tpl-cyber ul.points .num{color:var(--accent);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;margin-right:8px}
.tpl-cyber footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted);font-family:ui-monospace,'SF Mono',Menlo,monospace}

/* 25. academic 学术墙报：横幅标题 + 三栏（摘要/图表/结论） */
.tpl-academic{display:flex;flex-direction:column;width:min(88%,1150px);height:100%;padding:4vh 0}
.tpl-academic .banner{background:var(--accent);color:var(--bg);text-align:center;padding:3vh 2vw;border-radius:2px;margin-bottom:2.5vh}
.tpl-academic .banner h1{font-size:clamp(26px,3.2vw,40px);font-weight:800;line-height:1.3;color:var(--bg)}
.tpl-academic .banner .sub{font-size:11px;letter-spacing:2px;opacity:.85;margin-top:8px}
.tpl-academic .cols{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:2vw;flex:1;min-height:0}
.tpl-academic .col{border:1px solid var(--border);padding:2.5vh 1.6vw;background:var(--panel)}
.tpl-academic .col h2{font-size:13px;letter-spacing:2px;color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:2vh}
.tpl-academic .col p{font-size:13px;line-height:1.8;color:var(--text)}
.tpl-academic .col .quote{font-size:14px;line-height:1.9;color:var(--muted);font-style:italic;margin-bottom:2vh}
.tpl-academic .fig{border:2px dashed var(--border);height:120px;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:2vh;background:var(--bg2)}
.tpl-academic ul.points{list-style:none;display:flex;flex-direction:column;gap:12px}
.tpl-academic ul.points li{font-size:13px;line-height:1.7;color:var(--text);display:flex;gap:8px}
.tpl-academic ul.points .num{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--accent);font-weight:800;flex:none}
.tpl-academic footer{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1px;color:var(--muted);margin-top:1.5vh;border-top:1px solid var(--border);padding-top:10px}

/* 26. recruit 招聘海报：岗位巨字 + 亮点标签 + 福利卡 + CTA */
.tpl-recruit{display:flex;flex-direction:column;justify-content:center;width:min(82%,1100px);height:100%;padding:6vh 0}
.tpl-recruit .badge{align-self:flex-start;font-size:12px;font-weight:900;letter-spacing:2px;color:var(--bg);background:var(--accent);padding:7px 16px;border-radius:4px;margin-bottom:2.5vh}
.tpl-recruit h1{font-size:clamp(40px,5.4vw,72px);font-weight:900;line-height:1.1;color:var(--text);margin-bottom:1.5vh}
.tpl-recruit .quote{font-size:16px;color:var(--muted);margin-bottom:3.5vh}
.tpl-recruit .chips{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:3.5vh}
.tpl-recruit .chips span{font-size:13px;font-weight:800;color:var(--accent);border:2px solid var(--accent);border-radius:999px;padding:6px 16px;background:var(--tag-bg)}
.tpl-recruit ul.points{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:3.5vh}
.tpl-recruit ul.points li{font-size:15px;line-height:1.7;color:var(--text);background:var(--panel-solid);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.tpl-recruit ul.points .num{color:var(--accent);font-weight:900}
.tpl-recruit .cta{align-self:center;font-size:14px;font-weight:800;letter-spacing:2px;color:var(--bg);background:var(--accent);padding:12px 40px;border-radius:999px;box-shadow:0 6px 18px var(--glow)}
.tpl-recruit footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:2.5vh}

/* 27. invitation 邀请函：烫金双线框 + 衬线大字 + 装饰分隔 */
.tpl-invitation{display:flex;align-items:center;justify-content:center;width:min(80%,1050px);height:100%}
.tpl-invitation .card{position:relative;width:100%;border:1px solid var(--accent);outline:1px solid var(--accent);outline-offset:6px;background:var(--panel);padding:6vh 4vw;text-align:center}
.tpl-invitation .badge{font-size:11px;letter-spacing:6px;color:var(--accent);margin-bottom:3vh}
.tpl-invitation h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:clamp(36px,4.6vw,58px);font-weight:700;color:var(--text);margin-bottom:2vh;line-height:1.35}
.tpl-invitation .rule{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:2.5vh;color:var(--accent);font-size:13px}
.tpl-invitation .rule::before,.tpl-invitation .rule::after{content:'';height:1px;width:90px;background:linear-gradient(90deg,transparent,var(--accent))}
.tpl-invitation .rule::after{background:linear-gradient(90deg,var(--accent),transparent)}
.tpl-invitation .quote{font-size:15px;font-style:italic;color:var(--muted);margin-bottom:3.5vh}
.tpl-invitation ul.points{list-style:none;display:flex;justify-content:center;gap:3vw;flex-wrap:wrap;margin-bottom:3.5vh}
.tpl-invitation ul.points li{font-size:14px;color:var(--text);line-height:2}
.tpl-invitation ul.points .num{color:var(--accent);font-weight:800;margin-right:8px}
.tpl-invitation footer{font-size:10px;letter-spacing:3px;color:var(--muted);border-top:1px solid var(--border);padding-top:14px;display:flex;justify-content:center;gap:24px}

/* 28. notice 公告：红头大字 + 正文首行缩进 + 落款 */
.tpl-notice{display:flex;flex-direction:column;width:min(76%,1000px);height:100%;padding:5vh 0}
.tpl-notice .head{text-align:center;border-bottom:3px solid var(--accent);padding-bottom:2.5vh;margin-bottom:3.5vh}
.tpl-notice .head .badge{font-size:clamp(30px,3.8vw,48px);font-weight:900;letter-spacing:14px;color:var(--accent);line-height:1.3}
.tpl-notice .head .meta{font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:10px}
.tpl-notice h1{font-size:clamp(22px,2.6vw,32px);font-weight:800;text-align:center;color:var(--text);margin-bottom:3vh;line-height:1.5}
.tpl-notice .quote{font-size:15px;line-height:2;color:var(--text);text-indent:2em;margin-bottom:3vh}
.tpl-notice ul.points{list-style:none;margin-bottom:3vh}
.tpl-notice ul.points li{font-size:15px;line-height:2;color:var(--text);padding:6px 0;border-bottom:1px dashed var(--border);display:flex;gap:10px}
.tpl-notice ul.points .num{color:var(--accent);font-weight:800}
.tpl-notice footer{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted);gap:6px;margin-top:auto}

/* 29. inkwash 水墨：宣纸底 + 墨色远山 + 朱印落款（风格本体色特许：宣纸米/墨黑/朱砂红，经 color-mix 与主题变量氛围混合） */
.tpl-inkwash{display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:relative;overflow:hidden;background:color-mix(in srgb,#f5f0e3 78%,var(--bg) 22%)}
.tpl-inkwash .mt{position:absolute;border-radius:50%;pointer-events:none;background:color-mix(in srgb,#26221e 78%,var(--bg) 22%)}
.tpl-inkwash .m1{width:76%;height:26%;left:-6%;bottom:-7%;opacity:.07}
.tpl-inkwash .m2{width:92%;height:30%;left:14%;bottom:-13%;opacity:.13}
.tpl-inkwash .m3{width:104%;height:34%;left:24%;bottom:-17%;opacity:.2}
.tpl-inkwash .sun{position:absolute;right:15%;top:11%;width:min(15vw,110px);height:min(15vw,110px);border-radius:50%;background:color-mix(in srgb,#b03a2e 80%,var(--accent) 20%);opacity:.92;pointer-events:none}
.tpl-inkwash .content{position:relative;display:flex;flex-direction:column;justify-content:center;width:min(82%,1060px);height:100%;padding:7vh 0}
.tpl-inkwash .seal{align-self:flex-start;font-family:Georgia,'Songti SC','SimSun',serif;font-size:13px;font-weight:700;letter-spacing:2px;color:color-mix(in srgb,#f5f0e3 78%,var(--bg) 22%);background:color-mix(in srgb,#b03a2e 80%,var(--accent) 20%);padding:8px 12px;border-radius:4px;margin-bottom:3vh}
.tpl-inkwash h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:clamp(38px,5.2vw,66px);font-weight:700;color:color-mix(in srgb,#26221e 80%,var(--text) 20%);line-height:1.4;margin-bottom:2.5vh}
.tpl-inkwash .quote{font-size:16px;font-style:italic;color:color-mix(in srgb,#6b645a 75%,var(--muted) 25%);margin-bottom:4vh;max-width:72%;border-left:3px solid color-mix(in srgb,#b03a2e 80%,var(--accent) 20%);padding-left:18px;line-height:1.9}
.tpl-inkwash ul.points{list-style:none;display:flex;flex-direction:column;gap:14px;margin-bottom:4vh}
.tpl-inkwash ul.points li{font-size:15px;color:color-mix(in srgb,#26221e 80%,var(--text) 20%);display:flex;gap:12px;align-items:baseline;line-height:1.8}
.tpl-inkwash ul.points .num{font-family:Georgia,'Songti SC','SimSun',serif;color:color-mix(in srgb,#b03a2e 80%,var(--accent) 20%);font-weight:700;flex:none}
.tpl-inkwash footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:3px;color:color-mix(in srgb,#6b645a 75%,var(--muted) 25%);border-top:1px solid color-mix(in srgb,rgba(38,34,30,.18) 75%,var(--border) 25%);padding-top:14px}

/* 30. palace 红金宫廷：朱红底 + 回纹金边双线框 + 衬线金字（风格本体色特许：朱红/鎏金/米白，经 color-mix 与主题变量氛围混合） */
.tpl-palace{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:linear-gradient(160deg,color-mix(in srgb,#7a1f1f 78%,var(--bg) 22%),color-mix(in srgb,#5e1717 78%,var(--bg) 22%));padding:6vh 0}
.tpl-palace .frame{position:relative;width:min(80%,1060px);height:100%;display:flex;flex-direction:column;justify-content:center;border:2px solid color-mix(in srgb,#d4af37 80%,var(--accent) 20%);outline:1px solid color-mix(in srgb,#d4af37 80%,var(--accent) 20%);outline-offset:5px;padding:7vh 5vw;text-align:center;background:repeating-linear-gradient(90deg,rgba(212,175,55,.08) 0 2px,transparent 2px 34px)}
.tpl-palace .frame::after{content:'';position:absolute;inset:9px;border:1px solid rgba(212,175,55,.5);pointer-events:none}
.tpl-palace .badge{font-size:12px;letter-spacing:8px;color:color-mix(in srgb,#d4af37 80%,var(--accent) 20%);margin-bottom:2.5vh}
.tpl-palace h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:clamp(36px,4.8vw,62px);font-weight:700;color:color-mix(in srgb,#f5ead1 80%,var(--text) 20%);margin-bottom:2vh;line-height:1.4}
.tpl-palace .divider{display:flex;align-items:center;gap:14px;justify-content:center;color:color-mix(in srgb,#d4af37 80%,var(--accent) 20%);font-size:13px;margin-bottom:2.5vh}
.tpl-palace .divider::before,.tpl-palace .divider::after{content:'';height:1px;width:110px;background:linear-gradient(90deg,transparent,color-mix(in srgb,#d4af37 80%,var(--accent) 20%))}
.tpl-palace .divider::after{background:linear-gradient(90deg,color-mix(in srgb,#d4af37 80%,var(--accent) 20%),transparent)}
.tpl-palace .quote{font-size:15px;font-style:italic;color:color-mix(in srgb,#e8cba0 80%,var(--text) 20%);margin-bottom:3.5vh;max-width:70%;margin-left:auto;margin-right:auto}
.tpl-palace ul.points{list-style:none;display:flex;justify-content:center;gap:3.5vw;flex-wrap:wrap;margin-bottom:3.5vh}
.tpl-palace ul.points li{font-size:14px;color:color-mix(in srgb,#f5ead1 80%,var(--text) 20%);display:flex;gap:8px;align-items:center;line-height:1.8}
.tpl-palace ul.points .num{width:22px;height:22px;border:1px solid color-mix(in srgb,#d4af37 80%,var(--accent) 20%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:color-mix(in srgb,#d4af37 80%,var(--accent) 20%);flex:none}
.tpl-palace footer{display:flex;justify-content:center;gap:26px;font-size:10px;letter-spacing:3px;color:color-mix(in srgb,#d8b878 75%,var(--muted) 25%)}

/* 31. landscape 青绿山水：clip-path 层叠山峦 + 留白天际 + 题跋落款（风格本体色特许：青绿/赭石/留白，经 color-mix 与主题变量氛围混合） */
.tpl-landscape{display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:relative;overflow:hidden;background:color-mix(in srgb,#f4f1e8 78%,var(--bg) 22%)}
.tpl-landscape .peak{position:absolute;left:-6%;right:-6%;pointer-events:none}
.tpl-landscape .p1{bottom:36%;height:32%;background:color-mix(in srgb,#a8c6b4 80%,var(--accent) 20%);clip-path:polygon(0 100%,8% 42%,18% 66%,30% 30%,44% 58%,56% 38%,68% 62%,80% 34%,100% 70%,100% 100%)}
.tpl-landscape .p2{bottom:23%;height:32%;background:color-mix(in srgb,#6ea08d 80%,var(--accent) 20%);clip-path:polygon(0 100%,12% 48%,26% 72%,40% 40%,58% 68%,72% 44%,86% 70%,100% 50%,100% 100%)}
.tpl-landscape .p3{bottom:9%;height:30%;background:color-mix(in srgb,#4a8a76 80%,var(--accent) 20%);clip-path:polygon(0 100%,10% 58%,30% 78%,50% 52%,70% 80%,88% 60%,100% 84%,100% 100%)}
.tpl-landscape .p4{bottom:-5%;height:24%;background:color-mix(in srgb,#356b5a 80%,var(--accent) 20%);clip-path:polygon(0 100%,18% 62%,42% 86%,64% 66%,84% 90%,100% 74%,100% 100%)}
.tpl-landscape .content{position:relative;display:flex;flex-direction:column;justify-content:center;width:min(82%,1060px);height:100%;padding:7vh 0}
.tpl-landscape .badge{align-self:flex-start;font-family:Georgia,'Songti SC','SimSun',serif;font-size:12px;letter-spacing:6px;color:color-mix(in srgb,#356b5a 80%,var(--accent) 20%);border:1px solid color-mix(in srgb,#356b5a 80%,var(--accent) 20%);padding:6px 14px;margin-bottom:3vh}
.tpl-landscape h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:clamp(36px,4.8vw,62px);font-weight:700;color:color-mix(in srgb,#26352e 80%,var(--text) 20%);line-height:1.45;margin-bottom:2vh;max-width:82%}
.tpl-landscape .quote{font-size:15px;color:color-mix(in srgb,#5c6b62 75%,var(--muted) 25%);margin-bottom:4vh;max-width:64%;line-height:1.9}
.tpl-landscape ul.points{list-style:none;display:flex;flex-direction:column;gap:12px;margin-bottom:3.5vh}
.tpl-landscape ul.points li{font-size:14px;color:color-mix(in srgb,#26352e 80%,var(--text) 20%);display:flex;gap:10px;align-items:baseline}
.tpl-landscape ul.points .num{font-family:Georgia,'Songti SC','SimSun',serif;color:color-mix(in srgb,#b06a3b 80%,var(--accent) 20%);font-weight:700;flex:none}
.tpl-landscape footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:3px;color:color-mix(in srgb,#5c6b62 75%,var(--muted) 25%)}

/* 32. watermark 水印公文：斜置大字背景水印 + 居中公文正文（颜色跟随主题令牌） */
.tpl-watermark{display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:relative;overflow:hidden}
.tpl-watermark .wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:min(28vw,340px);font-weight:900;letter-spacing:12px;color:var(--accent);opacity:.07;white-space:nowrap;pointer-events:none}
.tpl-watermark .doc{position:relative;width:min(78%,1020px);height:100%;display:flex;flex-direction:column;justify-content:center;padding:6vh 0}
.tpl-watermark .head{text-align:center;border-bottom:2px solid var(--accent);padding-bottom:2.5vh;margin-bottom:3.5vh}
.tpl-watermark .head .badge{font-size:clamp(26px,3.4vw,42px);font-weight:900;letter-spacing:10px;color:var(--accent);line-height:1.3}
.tpl-watermark .head .meta{font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:10px}
.tpl-watermark h1{font-size:clamp(24px,2.8vw,36px);font-weight:800;text-align:center;color:var(--text);margin-bottom:3vh;line-height:1.5}
.tpl-watermark .quote{font-size:15px;line-height:2;color:var(--text);text-indent:2em;margin-bottom:3vh}
.tpl-watermark ul.points{list-style:none;margin-bottom:3vh}
.tpl-watermark ul.points li{font-size:15px;line-height:2;color:var(--text);padding:8px 0;border-bottom:1px dashed var(--border);display:flex;gap:12px;align-items:baseline}
.tpl-watermark ul.points .num{flex:none;align-self:center;width:24px;height:24px;border:1.5px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent);font-weight:800}
.tpl-watermark footer{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted);gap:6px;margin-top:auto}

/* ▼ 用户模板 CSS 内嵌点（TPL_DIR 模板的 TPL_CSS 块插到本行之前，无用户模板则保持原样） */
/* ═══ 切换坞（可折叠）：模板坞（32 标签七组流派 + 用户模板）在顶部、主题坞（25 色点 5×5）在右下角；默认折叠成胶囊把手，点开选完自动收起 ═══ */
.dock-tpl{position:fixed;right:18px;top:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:1001}
.dock-theme{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:1001}
.dock-bar{display:flex;align-items:center;gap:8px;background:var(--panel-solid);border:1px solid var(--border);border-radius:999px;padding:7px 13px;color:var(--text);cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.3);transition:border-color .15s ease;font-family:inherit}
.dock-bar:hover{border-color:var(--accent)}
.dock-bar .bar-arrow{font-size:9px;color:var(--muted);transition:transform .2s ease}
.dock-tpl.fold .dock-body,.dock-theme.fold .dock-body{display:none}
.dock-tpl.fold .bar-arrow{transform:rotate(-90deg)}
.dock-theme.fold .bar-arrow{transform:rotate(-90deg)}
.dock-theme .bar-arrow{transform:rotate(180deg)}
.dock-body{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;background:var(--panel-solid);border:1px solid var(--border);border-radius:14px;padding:8px 10px;max-width:min(720px,calc(100vw - 36px));box-shadow:0 4px 18px rgba(0,0,0,.3)}
.dock-theme .dock-body{display:grid;grid-template-columns:repeat(5,18px);gap:11px 10px;border-radius:14px;padding:12px 13px;max-width:none;position:relative}
.th-close{position:absolute;top:-10px;right:-10px;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--panel-solid);color:var(--muted);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.28);padding:0}
.th-close:hover{color:var(--text);border-color:var(--accent)}
.tp-sep{flex-basis:100%;font-size:10px;letter-spacing:2px;color:var(--muted);margin:5px 4px 1px;text-align:right}
.tp-sep::before{content:'— ';color:var(--accent)}
.bar-cur{width:17px;height:17px;pointer-events:none}
.th-tip{position:fixed;pointer-events:none;background:var(--panel-solid);border:1px solid var(--border);color:var(--text);font-size:11px;letter-spacing:1px;padding:4px 11px;border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.3);z-index:1002;opacity:0;transform:translateY(4px);transition:opacity .15s ease,transform .15s ease;white-space:nowrap}
.th-tip.show{opacity:1;transform:none}
[data-theme="light"] .th-tip{box-shadow:0 10px 28px rgba(30,31,34,.16)}
.tp-btn{font-size:12px;font-family:inherit;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:999px;padding:5px 11px;cursor:pointer;letter-spacing:1px;transition:all .15s ease;white-space:nowrap}
.tp-btn:hover{color:var(--text);border-color:var(--border)}
.tp-btn.on{color:var(--accent);background:var(--tag-bg);border-color:var(--accent);font-weight:600}
.th-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:1.5px solid rgba(127,127,127,.35);transition:transform .15s ease}
.th-dot:hover{transform:scale(1.18)}
.th-dot.on{border-color:var(--text)}
.th-dot[data-t="tech"]{background:#0ea5e9}
.th-dot[data-t="biz"]{background:#2563eb}
.th-dot[data-t="mono"]{background:#1e1f22}
.th-dot[data-t="light"]{background:#ffffff}
.th-dot[data-t="warm"]{background:#d97706}
.th-dot[data-t="ink"]{background:#b03a2e}
.th-dot[data-t="jade"]{background:#2dd4a7}
.th-dot[data-t="rose"]{background:#f472b6}
.th-dot[data-t="midnight"]{background:#e3b341}
.th-dot[data-t="violet"]{background:#a78bfa}
.th-dot[data-t="swiss"]{background:#e63946}
.th-dot[data-t="bauhaus"]{background:linear-gradient(135deg,#e63946 33%,#f4c20d 33% 66%,#1f5eff 66%)}
.th-dot[data-t="memphis"]{background:linear-gradient(135deg,#ff7bac 50%,#35d0ba 50%)}
.th-dot[data-t="morandi"]{background:linear-gradient(135deg,#c9a9a6 50%,#a3b18a 50%)}
.th-dot[data-t="nordic"]{background:linear-gradient(135deg,#b08d57 50%,#6b7f5e 50%)}
.th-dot[data-t="artdeco"]{background:linear-gradient(135deg,#d4af37 50%,#722f37 50%)}
.th-dot[data-t="noir"]{background:linear-gradient(135deg,#f2f2f2 50%,#1c1c1c 50%)}
.th-dot[data-t="classicblue"]{background:#0f4c81}
.th-dot[data-t="pop"]{background:linear-gradient(135deg,#f7d32b 50%,#e63946 50%)}
.th-dot[data-t="retro"]{background:linear-gradient(135deg,#f3e5cf 50%,#a63d2f 50%)}
.th-dot[data-t="coral"]{background:#ff6f61}
.th-dot[data-t="acid"]{background:#c6ff00}
.th-dot[data-t="cyber"]{background:#00e5ff}
.th-dot[data-t="cream"]{background:#c8432e}
.th-dot[data-t="academic"]{background:#1a3c6e}

/* ═══ 入场动画 + 截图模式 + 响应式 ═══ */
.anim{animation:riseIn .55s ease both;opacity:0}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
html[data-shot] .anim{animation:none!important;opacity:1!important;transform:none!important}
html[data-shot] .dock-tpl,html[data-shot] .dock-theme{display:none!important}
@media (max-width:680px){
  .tpl-classic{width:86%}.tpl-classic ul.points{grid-template-columns:1fr}
  .tpl-magazine .cols{grid-template-columns:1fr;gap:28px}
  .tpl-dash{grid-template-columns:1fr;gap:36px}
  .tpl-grid .cards{grid-template-columns:1fr}
  .tpl-hero ul.points{flex-direction:column;gap:12px}
  .tp-btn{font-size:11px;padding:4px 8px}
  .dock-body{max-width:calc(100vw - 36px)}
}
/* 主题切换渐变：切换瞬间给 html 挂 .theming 类（650ms 后自动摘除），期间全页颜色属性平滑过渡；平时类不存在，不影响任何元素 */
html.theming, html.theming *, html.theming *::before, html.theming *::after{ transition: background .45s cubic-bezier(.4,0,.2,1), background-color .45s cubic-bezier(.4,0,.2,1), color .45s cubic-bezier(.4,0,.2,1), border-color .45s cubic-bezier(.4,0,.2,1), box-shadow .45s cubic-bezier(.4,0,.2,1), fill .45s cubic-bezier(.4,0,.2,1), stroke .45s cubic-bezier(.4,0,.2,1) !important; }
@media (prefers-reduced-motion: reduce){ html.theming, html.theming *{ transition: none !important; } }

</style>

<body>

  <button class="dock-bar" id="tplBar" type="button" title="模板切换（点击展开/收起）"><span class="bar-tpl-name">模板</span><span class="bar-arrow">▾</span></button>
  <div class="dock-body">
  <span class="tp-sep">现代主义</span>
  <button class="tp-btn on" data-tpl="classic" title="经典舞台">经典</button>
  <button class="tp-btn" data-tpl="minimal" title="极简留白">极简</button>
  <button class="tp-btn" data-tpl="swiss" title="瑞士国际主义">瑞士</button>
  <button class="tp-btn" data-tpl="window" title="荷兰视窗分割">视窗</button>
  <span class="tp-sep">编辑出版</span>
  <button class="tp-btn" data-tpl="magazine" title="杂志社论">杂志</button>
  <button class="tp-btn" data-tpl="editorial" title="编辑刊跨栏">编辑刊</button>
  <button class="tp-btn" data-tpl="typo" title="大字报纯排版">大字报</button>
  <button class="tp-btn" data-tpl="newspaper" title="报纸头版">报纸</button>
  <span class="tp-sep">数据商务</span>
  <button class="tp-btn" data-tpl="dashboard" title="数据仪表">数据</button>
  <button class="tp-btn" data-tpl="grid" title="卡片栅格">栅格</button>
  <button class="tp-btn" data-tpl="timeline" title="时间叙事">时间线</button>
  <button class="tp-btn" data-tpl="hero" title="巨幕大字">巨幕</button>
  <span class="tp-sep">艺术流派</span>
  <button class="tp-btn" data-tpl="bauhaus" title="包豪斯几何">包豪斯</button>

  /* ═══════════ 页面 ID 自愈（沿用旧版机制） ═══════════ */
  var KEY = 'sf-heal:' + location.pathname;
  var m = document.querySelector('meta[name="poster-id"]');
  var ok = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(m ? m.content : '');
  var ID;
  if (ok) { ID = m.content; }
  else {
    var v = localStorage.getItem(KEY);
    if (!v) { v = crypto.randomUUID(); localStorage.setItem(KEY, v); }
    ID = v;
    m.setAttribute('content', v);
    console.warn('[poster] 非法 id meta 已自愈为 ' + v);
  }

  /* ═══════════ 主题换肤（十套配色） ═══════════ */
  var THEMES = ['tech','biz','mono','light','warm','ink','jade','rose','midnight','violet','swiss','bauhaus','memphis','morandi','nordic','artdeco','noir','classicblue','pop','retro','coral','acid','cyber','cream','academic'];
  var THEME_KEY = 'poster:' + ID + '-theme';
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch(e) {}
  if (savedTheme && THEMES.indexOf(savedTheme) !== -1) document.documentElement.setAttribute('data-theme', savedTheme);
  var curT = document.documentElement.getAttribute('data-theme');
  if (THEMES.indexOf(curT) === -1) { curT = 'tech'; document.documentElement.setAttribute('data-theme', curT); }
  var TH_DOTS = document.querySelectorAll('#themeDock .dock-body .th-dot');
  var TH_LABELS = {};
  TH_DOTS.forEach(function(d){ TH_LABELS[d.getAttribute('data-t')] = d.getAttribute('title') || ''; });
  var thTip = document.createElement('div');
  thTip.className = 'th-tip';
  document.body.appendChild(thTip);
  function updateThBar(){
    var bc = document.querySelector('#thBar .bar-cur'); if (bc) bc.setAttribute('data-t', curT);
    var tn = document.getElementById('thName'); if (tn) tn.textContent = '主题 · ' + (TH_LABELS[curT] || '自定义');
  }
  TH_DOTS.forEach(function(d){ d.classList.toggle('on', d.getAttribute('data-t') === curT); });
  TH_DOTS.forEach(function(d){
    d.addEventListener('click', function(){
      var t = d.getAttribute('data-t');
      curT = t;
      var r = document.documentElement; r.classList.add('theming'); clearTimeout(r.__sfThT); r.__sfThT = setTimeout(function(){ r.classList.remove('theming'); }, 650);
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem(THEME_KEY, t); } catch(e) {}
      TH_DOTS.forEach(function(x){ x.classList.toggle('on', x === d); });
      updateThBar();
    });
    d.addEventListener('mouseenter', function(){
      var name = TH_LABELS[d.getAttribute('data-t')];
      if (!name) return;
      thTip.textContent = name;
      thTip.classList.add('show');
      var r = d.getBoundingClientRect();
      var tw = thTip.offsetWidth;
      thTip.style.left = Math.min(Math.max(r.left + r.width / 2 - tw / 2, 8), window.innerWidth - tw - 8) + 'px';
      thTip.style.top = Math.max(r.top - 34, 8) + 'px';
    });
    d.addEventListener('mouseleave', function(){ thTip.classList.remove('show'); });
  });

  /* ═══════════ 模板切换（三十二套布局七组流派随点随换，记忆上次选择） ═══════════ */
  var TPLS = ['classic','minimal','magazine','hero','timeline','grid','dashboard','brutalist','swiss','bauhaus','mondrian','editorial','typo','memphis','exhibit','window','newspaper','popart','opart','artnouveau','acid','glitch','vaporwave','cyber','academic','recruit','invitation','notice','inkwash','palace','landscape','watermark']; /* ▼ 用户模板 name 内嵌点：数组末尾（'watermark' 之后）追加 ,'{name}'，无用户模板则保持原样 */
  var TPL_KEY = 'poster:' + ID + '-tpl';
  var savedTpl = null;
  try { savedTpl = localStorage.getItem(TPL_KEY); } catch(e) {}
  if (savedTpl && TPLS.indexOf(savedTpl) !== -1) document.documentElement.setAttribute('data-template', savedTpl);
  var curP = document.documentElement.getAttribute('data-template');
  if (TPLS.indexOf(curP) === -1) { curP = 'classic'; document.documentElement.setAttribute('data-template', curP); }

  function render(){
    var stage = document.getElementById('stage');
    stage.innerHTML = TPL[curP] ? TPL[curP]() : TPL.classic();
    var els = stage.querySelectorAll('.anim');
    els.forEach(function(e,i){ e.style.animationDelay = (i * 0.12) + 's'; });
    setTimeout(function(){ els.forEach(function(e){ e.style.opacity = '1'; e.style.transform = 'none'; }); }, 2000);
    fit();
  }
  document.querySelectorAll('.tp-btn').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-tpl') === curP);
    b.addEventListener('click', function(){
      curP = b.getAttribute('data-tpl');
      document.documentElement.setAttribute('data-template', curP);
      try { localStorage.setItem(TPL_KEY, curP); } catch(e) {}
      document.querySelectorAll('.tp-btn').forEach(function(x){ x.classList.toggle('on', x === b); });
      var bt = document.querySelector('#tplBar .bar-tpl-name'); if (bt) bt.textContent = '模板 · ' + b.textContent;
      document.getElementById('tplDock').classList.add('fold');
      render();
    });
  });

  /* ═══════════ 一屏自适应缩放 + ?shot 截图模式 ═══════════ */
  function fit(){
    var stage = document.getElementById('stage');
    stage.style.transform = 'none';
    var scale = Math.min(1, window.innerHeight / (stage.scrollHeight + 1));
    if (scale < 1) { stage.style.transform = 'scale(' + scale + ')'; stage.style.transformOrigin = 'center center'; }
  }
  render();
  /* ═══════════ 折叠把手：默认折叠、点击展开、选中后自动收起 ═══════════ */
  function bindBar(dockId){
    var dock = document.getElementById(dockId);
    if (!dock) return;
    dock.querySelector('.dock-bar').addEventListener('click', function(){ dock.classList.toggle('fold'); });
  }
  bindBar('tplDock');
  bindBar('themeDock');
  var thClose = document.getElementById('thClose');
  if (thClose) thClose.addEventListener('click', function(){ document.getElementById('themeDock').classList.add('fold'); });
  var initTplBtn = document.querySelector('#tplDock .tp-btn[data-tpl="' + curP + '"]');
  var btEl = document.querySelector('#tplBar .bar-tpl-name');
  if (btEl) btEl.textContent = '模板 · ' + (initTplBtn ? initTplBtn.textContent : '自定义');
  updateThBar();
  window.addEventListener('resize', fit);
  if (location.search.indexOf('shot') !== -1) {
    document.documentElement.setAttribute('data-shot', '1');
    var els = document.querySelectorAll('.anim');
    els.forEach(function(e){ e.style.opacity = '1'; e.style.transform = 'none'; e.style.animationDelay = '0s'; });
    fit();
  }
})();
