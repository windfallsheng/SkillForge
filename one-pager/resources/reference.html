*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{background:linear-gradient(180deg,var(--bg) 12%,var(--bg2) 135%);color:var(--text);font-family:system-ui,'Segoe UI',Roboto,sans-serif;overflow:hidden;position:relative}

/* ═══ 舞台与八套模板（html[data-template] 决定渲染哪套；模板管布局、主题管配色，80 种组合） ═══ */
.stage{height:100svh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;overflow:hidden}
.serif{font-family:Georgia,'Songti SC','SimSun',serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace}

/* 1. classic 经典舞台：徽章 + 渐变巨字 + 分隔线 + 金句 + 三列要点卡 */
.tpl-classic{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:min(60%,1200px);height:100%;padding:6vh 0}
.tpl-classic .badge{font-size:12px;letter-spacing:3px;color:var(--accent);margin-bottom:22px}
.tpl-classic h1{font-size:clamp(40px,5vw,64px);line-height:1.2;font-weight:800;letter-spacing:2px;background:var(--title-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:18px;text-shadow:0 0 40px var(--glow)}
.tpl-classic .divider{width:64px;height:2px;background:var(--title-grad);border-radius:2px;margin:0 auto 26px}
.tpl-classic .quote{font-size:22px;font-style:italic;color:var(--text);line-height:1.8;margin-bottom:40px}
.tpl-classic .quote::before{content:"「";color:var(--accent)}
.tpl-classic .quote::after{content:"」";color:var(--accent)}
.tpl-classic ul.points{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:44px;text-align:left;width:100%}
.tpl-classic ul.points li{display:flex;align-items:flex-start;gap:12px;font-size:16px;line-height:1.7;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:18px 16px}
.tpl-classic .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--glow);flex:none;margin-top:8px}

/* 2. minimal 极简留白：瑞士平面，左上小标 + 衬线巨字 + 细线 + 编号竖排要点 */
.tpl-minimal{display:flex;flex-direction:column;justify-content:center;text-align:left;width:min(74%,1200px);height:100%;padding:6vh 0}
.tpl-minimal .badge{font-size:11px;letter-spacing:4px;color:var(--muted);margin-bottom:30px;display:flex;align-items:center;gap:14px}
.tpl-minimal .badge::before{content:'';width:28px;height:1px;background:var(--accent)}
.tpl-minimal h1{font-family:Georgia,'Songti SC','SimSun',serif;font-weight:700;font-size:clamp(42px,5.4vw,70px);line-height:1.28;color:var(--text);margin-bottom:36px}
.tpl-minimal .rule{width:100%;height:1px;background:var(--border);margin-bottom:30px}
.tpl-minimal .quote{font-size:18px;font-style:italic;color:var(--muted);line-height:1.8;margin-bottom:40px}
.tpl-minimal ol.points{list-style:none;display:flex;flex-direction:column;gap:20px;margin-bottom:50px}
.tpl-minimal ol.points li{display:flex;align-items:baseline;gap:24px;font-size:17px;line-height:1.6;color:var(--text)}
.tpl-minimal .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--accent);letter-spacing:1px;flex:none}
.tpl-minimal .meta{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 3. magazine 杂志社论：刊头通栏线 + 左文右栏 + 首字下沉金句 */
.tpl-magazine{display:flex;flex-direction:column;justify-content:center;width:min(78%,1200px);height:100%;padding:6vh 0}
.tpl-magazine .masthead{display:flex;align-items:center;gap:16px;font-size:11px;letter-spacing:3px;color:var(--muted);padding-bottom:14px;border-bottom:2px solid var(--text);margin-bottom:36px}
.tpl-magazine .masthead::after{content:'';flex:1;height:1px;background:var(--border)}
.tpl-magazine .cols{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
.tpl-magazine h1{font-family:Georgia,'Songti SC','SimSun',serif;font-weight:700;font-size:clamp(36px,4.4vw,54px);line-height:1.32;color:var(--text);margin-bottom:24px}
.tpl-magazine .quote{font-size:17px;line-height:1.95;color:var(--muted);font-style:italic}
.tpl-magazine .quote::first-letter{font-size:46px;float:left;line-height:.85;margin:4px 10px 0 0;color:var(--accent);font-family:Georgia,serif;font-style:normal;font-weight:700}
.tpl-magazine ul.points{list-style:none;display:flex;flex-direction:column;gap:20px;border-left:1px solid var(--border);padding-left:26px}
.tpl-magazine ul.points li{display:flex;gap:14px;font-size:16px;line-height:1.65;color:var(--text)}
.tpl-magazine .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--accent);padding-top:3px;flex:none}
.tpl-magazine .footbar{margin-top:40px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 4. hero 巨幕：电影海报式巨型关键词 + 底部要点横条 */
.tpl-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;padding:6vh 8vw;position:relative}
.tpl-hero .badge{font-size:12px;letter-spacing:4px;color:var(--accent);margin-bottom:28px}
.tpl-hero h1{font-size:clamp(56px,10vw,140px);font-weight:900;letter-spacing:6px;line-height:1.06;background:var(--title-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:28px;text-shadow:0 0 60px var(--glow)}
.tpl-hero .quote{font-size:20px;letter-spacing:2px;color:var(--text);opacity:.92;margin-bottom:8vh}
.tpl-hero ul.points{list-style:none;display:flex;gap:16px;width:min(84%,1100px)}
.tpl-hero ul.points li{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:16px 14px;font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:8px;text-align:left}
.tpl-hero .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--accent);letter-spacing:1px}
.tpl-hero footer{position:absolute;bottom:4.5vh;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 5. timeline 时间叙事：中央竖线 + 节点圆点 + 要点左右交替卡片 */
.tpl-timeline{display:flex;flex-direction:column;justify-content:center;width:min(76%,1100px);height:100%;padding:6vh 0}
.tpl-timeline .head{text-align:center;margin-bottom:8vh}
.tpl-timeline h1{font-size:clamp(34px,4.2vw,50px);font-weight:800;background:var(--title-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px}
.tpl-timeline .quote{font-size:16px;font-style:italic;color:var(--muted)}
.tpl-timeline .track{position:relative;width:100%}
.tpl-timeline .track::before{content:'';position:absolute;left:50%;top:2%;bottom:2%;width:2px;transform:translateX(-50%);background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:.5}
.tpl-timeline .row{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;margin-bottom:24px;position:relative}
.tpl-timeline .mid{display:flex;justify-content:center;grid-column:2;grid-row:1;z-index:1}
.tpl-timeline .dot{width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);box-shadow:0 0 16px var(--glow)}
.tpl-timeline .card{grid-column:1;grid-row:1;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 20px;font-size:15px;line-height:1.65;text-align:right}
.tpl-timeline .row:nth-child(odd) .card{grid-column:3;text-align:left}
.tpl-timeline .card .num{display:block;font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:4px}
.tpl-timeline footer{text-align:center;margin-top:5vh;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 6. grid 卡片栅格：标题区 + 2×2 大圆角卡片（编号描边角标 + 渐变顶条） */
.tpl-grid{display:flex;flex-direction:column;justify-content:center;width:min(80%,1200px);height:100%;padding:6vh 0}
.tpl-grid .head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:5vh}
.tpl-grid h1{font-size:clamp(38px,4.6vw,56px);font-weight:800;background:var(--title-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.tpl-grid .quote{font-size:15px;font-style:italic;color:var(--muted);text-align:right;max-width:42%;line-height:1.7}
.tpl-grid .cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.tpl-grid .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px 26px 24px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;min-height:150px}
.tpl-grid .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.85}
.tpl-grid .card.wide{grid-column:1/-1;min-height:110px}
.tpl-grid .card .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;font-weight:700;color:transparent;-webkit-text-stroke:1px var(--accent);line-height:1}
.tpl-grid .card .t{font-size:16px;line-height:1.65;color:var(--text)}
.tpl-grid footer{margin-top:4vh;text-align:center;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 7. dashboard 数据仪表：KPI 环形图 + 要点进度条 + 右栏标题金句 */
.tpl-dash{display:grid;grid-template-columns:320px 1fr;gap:56px;align-items:center;width:min(82%,1200px);height:100%;padding:6vh 0}
.tpl-dash .kpi{display:flex;flex-direction:column;align-items:center;gap:30px}
.tpl-dash .ring{width:190px;height:190px;border-radius:50%;background:conic-gradient(var(--accent) 0 82%,var(--panel-solid) 82% 100%);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 44px var(--glow-soft)}
.tpl-dash .ring::after{content:'';position:absolute;inset:15px;border-radius:50%;background:var(--bg)}
.tpl-dash .val{position:relative;z-index:1;font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:44px;font-weight:700;color:var(--text)}
.tpl-dash .lab{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:2px;color:var(--muted);z-index:1}
.tpl-dash .bars{display:flex;flex-direction:column;gap:20px;width:100%}
.tpl-dash .bar .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:var(--text)}
.tpl-dash .bar .row .pct{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent)}
.tpl-dash .bar .track{height:10px;background:var(--panel-solid);border:1px solid var(--border);border-radius:99px;overflow:hidden}
.tpl-dash .bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tpl-dash .side h1{font-size:clamp(34px,4.2vw,50px);font-weight:800;line-height:1.3;margin-bottom:16px;color:var(--text)}
.tpl-dash .side .quote{font-size:17px;font-style:italic;color:var(--muted);line-height:1.8;margin-bottom:24px}
.tpl-dash .side .extra{list-style:none;display:flex;flex-direction:column;gap:12px}
.tpl-dash .side .extra li{display:flex;gap:12px;font-size:15px;color:var(--text);align-items:baseline}
.tpl-dash .side .extra .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--accent)}
.tpl-dash .side .foot{margin-top:28px;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 8. brutalist 新粗野：撞色块 + 4px 粗框 + 8px 硬阴影 + 零圆角 */
.tpl-brutal{display:flex;flex-direction:column;justify-content:center;gap:28px;width:min(80%,1100px);height:100%;padding:6vh 0}
.tpl-brutal .badge{align-self:flex-start;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--bg);background:var(--accent);padding:6px 16px;border:4px solid var(--text);box-shadow:6px 6px 0 var(--accent2)}
.tpl-brutal h1{font-size:clamp(44px,6.4vw,80px);font-weight:900;line-height:1.08;color:var(--bg);background:var(--text);padding:12px 28px;align-self:flex-start;border:4px solid var(--text);box-shadow:10px 10px 0 var(--accent)}
.tpl-brutal .quote{font-size:18px;font-weight:600;line-height:1.75;border-left:10px solid var(--accent2);padding-left:20px;max-width:88%}
.tpl-brutal ul.points{list-style:none;display:flex;flex-wrap:wrap;gap:16px}
.tpl-brutal ul.points li{font-size:15px;font-weight:700;padding:12px 20px;background:var(--panel-solid);border:4px solid var(--text);box-shadow:6px 6px 0 var(--accent2)}
.tpl-brutal ul.points li .num{margin-right:10px;font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent)}
.tpl-brutal footer{font-size:11px;font-weight:700;letter-spacing:2px;border-top:4px solid var(--text);padding-top:14px;display:flex;justify-content:space-between;align-items:center;color:var(--text)}


/* 9. swiss 瑞士国际主义：严格左对齐网格 + 超大无衬线标题 + 底部信息通栏 */
.tpl-swiss{display:flex;flex-direction:column;justify-content:center;width:min(82%,1100px);height:100%;padding:6vh 0;text-align:left}
.tpl-swiss .badge{font-size:11px;font-weight:700;letter-spacing:4px;color:var(--accent);margin-bottom:3.5vh;display:flex;align-items:center;gap:14px}
.tpl-swiss .badge::before{content:'';width:36px;height:3px;background:var(--accent)}
.tpl-swiss h1{font-size:clamp(46px,6.4vw,82px);font-weight:900;line-height:1.06;letter-spacing:-1px;color:var(--text);margin-bottom:3vh}
.tpl-swiss .rule{width:100%;height:2px;background:var(--text);margin-bottom:3vh;position:relative}
.tpl-swiss .rule::after{content:'';position:absolute;right:0;top:0;width:18%;height:2px;background:var(--accent)}
.tpl-swiss .quote{font-size:17px;line-height:1.8;color:var(--muted);margin-bottom:4vh;max-width:72%}
.tpl-swiss ul.points{list-style:none;display:flex;gap:28px;margin-bottom:5vh}
.tpl-swiss ul.points li{flex:1;font-size:14px;line-height:1.7;color:var(--text);border-top:1px solid var(--border);padding-top:14px}
.tpl-swiss ul.points li .num{display:block;font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--accent);margin-bottom:8px}
.tpl-swiss footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 10. bauhaus 包豪斯：几何元素（圆/方/三角）+ 三原色块 + 粗黑线 */
.tpl-bauhaus{display:flex;flex-direction:column;justify-content:center;width:min(82%,1100px);height:100%;padding:6vh 0;position:relative}
.tpl-bauhaus .geo{position:absolute;top:8vh;right:3vw;display:flex;gap:18px;align-items:flex-end;opacity:.92}
.tpl-bauhaus .geo .c{width:60px;height:60px;border-radius:50%;background:var(--accent)}
.tpl-bauhaus .geo .s{width:46px;height:46px;background:var(--accent2);transform:rotate(24deg)}
.tpl-bauhaus .geo .t{width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:46px solid var(--accent)}
.tpl-bauhaus .badge{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--bg);background:var(--accent);padding:6px 14px;align-self:flex-start;margin-bottom:3.5vh}
.tpl-bauhaus h1{font-size:clamp(42px,5.8vw,74px);font-weight:900;line-height:1.1;color:var(--text);margin-bottom:3vh;max-width:78%}
.tpl-bauhaus .quote{font-size:16px;line-height:1.8;color:var(--muted);margin-bottom:4vh;max-width:60%}
.tpl-bauhaus ul.points{list-style:none;display:flex;gap:18px;margin-bottom:5vh}
.tpl-bauhaus ul.points li{flex:1;font-size:15px;line-height:1.7;color:var(--text);background:var(--panel-solid);padding:16px 14px;border-top:6px solid var(--accent)}
.tpl-bauhaus ul.points li:nth-child(2){border-top-color:var(--accent2)}
.tpl-bauhaus ul.points li .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;color:var(--accent);margin-right:8px}
.tpl-bauhaus .footbar{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:4px solid var(--text);font-size:10px;letter-spacing:2px;color:var(--muted)}
.tpl-bauhaus .footbar::before{content:'';width:60px;height:12px;background:var(--accent2)}

/* 11. mondrian 蒙德里安：黑粗线网格 + 红黄蓝色块填充 */
.tpl-mondrian{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:1fr auto;gap:10px;width:min(84%,1150px);height:88%;background:var(--panel-solid);border:8px solid var(--text)}
.tpl-mondrian .cell{position:relative;overflow:hidden}
.tpl-mondrian .main{grid-row:1;grid-column:1;display:flex;flex-direction:column;justify-content:center;padding:4vh 3vw}
.tpl-mondrian .side{grid-row:1/3;grid-column:2;background:var(--accent);display:flex;flex-direction:column;justify-content:center;padding:3vh 2vw}
.tpl-mondrian .band{grid-row:2;grid-column:1;background:var(--accent2);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.tpl-mondrian .badge{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:2vh}
.tpl-mondrian h1{font-size:clamp(36px,4.6vw,60px);font-weight:900;line-height:1.15;color:var(--text);margin-bottom:2vh}
.tpl-mondrian .quote{font-size:15px;line-height:1.8;color:var(--muted)}
.tpl-mondrian .side ul{list-style:none;display:flex;flex-direction:column;gap:16px}
.tpl-mondrian .side li{font-size:14px;font-weight:700;line-height:1.6;color:var(--bg);display:flex;gap:10px;align-items:flex-start}
.tpl-mondrian .side .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;font-size:13px;color:var(--bg);border:2px solid var(--bg);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none}
.tpl-mondrian .band .lab{font-size:11px;letter-spacing:2px;color:var(--bg);font-weight:700}
.tpl-mondrian .band .v{font-size:13px;font-weight:900;color:var(--bg)}

/* 12. editorial 编辑刊：刊头通栏双线 + 首字下沉 + 左右双栏 */
.tpl-editorial{display:flex;flex-direction:column;justify-content:center;width:min(80%,1150px);height:100%;padding:5vh 0}
.tpl-editorial .masthead{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--text);border-bottom:1px solid var(--text);padding:12px 0;margin-bottom:4vh;font-size:11px;letter-spacing:3px;color:var(--muted)}
.tpl-editorial .masthead b{font-size:15px;color:var(--text);letter-spacing:4px}
.tpl-editorial .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:6vw;margin-bottom:4vh}
.tpl-editorial h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:clamp(38px,4.4vw,56px);font-weight:700;line-height:1.28;color:var(--text);margin-bottom:2.5vh}
.tpl-editorial h1::first-letter{font-size:1.9em;color:var(--accent);float:left;line-height:.9;margin:4px 10px 0 0;font-weight:900}
.tpl-editorial .quote{font-size:16px;line-height:1.9;color:var(--muted);font-style:italic}
.tpl-editorial ul.points{list-style:none;display:flex;flex-direction:column;gap:18px}
.tpl-editorial ul.points li{display:flex;gap:14px;font-size:15px;line-height:1.7;color:var(--text);padding-bottom:14px;border-bottom:1px solid var(--border)}
.tpl-editorial ul.points li:last-child{border-bottom:none}
.tpl-editorial .num{font-family:Georgia,serif;font-size:30px;font-weight:900;color:var(--accent);line-height:1;flex:none}
.tpl-editorial .footbar{display:flex;justify-content:space-between;border-top:3px double var(--text);padding-top:14px;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 13. typo 大字报：巨型标题撑满 + 底部要点三列 */
.tpl-typo{display:flex;flex-direction:column;justify-content:flex-end;width:min(88%,1200px);height:100%;padding:6vh 2vw 5vh;text-align:left}
.tpl-typo .badge{font-size:11px;letter-spacing:4px;color:var(--accent);margin-bottom:2vh}
.tpl-typo h1{font-size:clamp(60px,9.2vw,128px);font-weight:900;line-height:.97;letter-spacing:-2px;color:var(--text);margin-bottom:2.5vh}
.tpl-typo .quote{font-size:16px;line-height:1.8;color:var(--muted);margin-bottom:4vh;max-width:60%}
.tpl-typo ul.points{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:4vh;border-top:2px solid var(--text);padding-top:18px}
.tpl-typo ul.points li{font-size:14px;line-height:1.7;color:var(--text)}
.tpl-typo ul.points li .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;color:var(--accent);margin-right:8px}
.tpl-typo footer{font-size:10px;letter-spacing:2px;color:var(--muted);display:flex;justify-content:space-between}

/* 14. memphis 孟菲斯：波点底纹 + 撞色徽章 + 卡片微斜错落 */
.tpl-memphis{display:flex;flex-direction:column;justify-content:center;width:min(84%,1150px);height:100%;padding:6vh 0;position:relative}
.tpl-memphis .dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(var(--border) 3px,transparent 3px);background-size:44px 44px;opacity:.6}
.tpl-memphis .badge{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:2px;color:var(--bg);background:var(--accent);padding:8px 16px;border-radius:999px;margin-bottom:3.5vh;transform:rotate(-2deg)}
.tpl-memphis h1{font-size:clamp(42px,5.6vw,70px);font-weight:900;line-height:1.1;color:var(--text);margin-bottom:3vh}
.tpl-memphis .quote{font-size:16px;line-height:1.8;color:var(--muted);margin-bottom:4vh;max-width:66%}
.tpl-memphis ul.points{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:5vh}
.tpl-memphis ul.points li{font-size:15px;line-height:1.7;color:var(--text);background:var(--panel-solid);border:3px solid var(--text);border-radius:14px;padding:18px 16px;display:flex;gap:12px;align-items:flex-start}
.tpl-memphis ul.points li:nth-child(odd){transform:rotate(-1.2deg)}
.tpl-memphis ul.points li:nth-child(even){transform:rotate(1.2deg);background:var(--tag-bg)}
.tpl-memphis .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;font-size:15px;color:var(--accent);background:var(--bg);border-radius:8px;padding:4px 8px;flex:none}
.tpl-memphis footer{font-size:11px;letter-spacing:2px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}

/* 15. exhibit 展览海报：展签卡片（白卡黑框硬影微斜）+ 大标题 + 底注 */
.tpl-exhibit{display:flex;flex-direction:column;justify-content:center;width:min(82%,1150px);height:100%;padding:6vh 0;position:relative}
.tpl-exhibit .wall-label{position:absolute;top:6vh;right:0;font-size:10px;letter-spacing:3px;color:var(--muted);writing-mode:vertical-rl}
.tpl-exhibit .title-block{display:flex;align-items:baseline;gap:20px;margin-bottom:3vh}
.tpl-exhibit .title-block h1{font-size:clamp(42px,5.4vw,68px);font-weight:800;line-height:1.12;color:var(--text)}
.tpl-exhibit .title-block .yr{font-family:Georgia,serif;font-size:20px;font-style:italic;color:var(--accent)}
.tpl-exhibit .quote{font-size:16px;line-height:1.8;color:var(--muted);margin-bottom:4vh;max-width:70%}
.tpl-exhibit .label-card{background:var(--panel-solid);border:3px solid var(--text);padding:24px 26px;box-shadow:10px 10px 0 var(--accent);transform:rotate(-.6deg);margin-bottom:5vh}
.tpl-exhibit .label-card .lab{font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:14px;font-weight:700}
.tpl-exhibit .label-card ul{list-style:none;display:flex;gap:24px;flex-wrap:wrap}
.tpl-exhibit .label-card li{flex:1;min-width:180px;font-size:14px;line-height:1.7;color:var(--text)}
.tpl-exhibit .label-card .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent);font-weight:800;margin-right:8px}
.tpl-exhibit footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted)}

/* 16. window 荷兰视窗：不对称 2:1 网格 + 色块开窗 */
.tpl-window{display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:1.2fr 1fr;gap:14px;width:min(84%,1150px);height:86%;padding:4vh 0}
.tpl-window .win{overflow:hidden;position:relative}
.tpl-window .w-main{grid-column:1;grid-row:1/3;background:var(--panel-solid);border:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;padding:5vh 3vw}
.tpl-window .w-top{grid-column:2;grid-row:1;background:var(--accent);display:flex;flex-direction:column;justify-content:center;padding:3vh 2vw}
.tpl-window .w-bottom{grid-column:2;grid-row:2;border:3px solid var(--text);background:var(--bg2);display:flex;flex-direction:column;justify-content:center;padding:3vh 2vw}
.tpl-window .badge{font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:2.5vh}
.tpl-window h1{font-size:clamp(34px,4.2vw,54px);font-weight:900;line-height:1.15;color:var(--text);margin-bottom:3vh}
.tpl-window .w-main ul{list-style:none;display:flex;flex-direction:column;gap:14px}
.tpl-window .w-main li{font-size:14px;line-height:1.65;color:var(--text);display:flex;gap:10px;align-items:baseline}
.tpl-window .w-main .num{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--accent);font-weight:800}
.tpl-window .w-top .k{font-size:11px;letter-spacing:2px;color:var(--bg);font-weight:700;margin-bottom:12px}
.tpl-window .w-top .v{font-size:clamp(18px,2.2vw,28px);font-weight:900;color:var(--bg);line-height:1.4}
.tpl-window .w-bottom .v{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:16px}
.tpl-window .w-bottom footer{font-size:9px;letter-spacing:1px;color:var(--muted)}

/* ▼ 用户模板 CSS 内嵌点（TPL_DIR 模板的 TPL_CSS 块插到本行之前，无用户模板则保持原样） */
/* ═══ 切换坞：模板坞（16 标签 + 用户模板，自动换行）在上、主题坞（7 色点 × 3 行）在下，右下角堆叠 ═══ */
.dock-tpl{position:fixed;right:18px;bottom:96px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;background:var(--panel-solid);border:1px solid var(--border);border-radius:14px;padding:8px 10px;max-width:min(560px,calc(100vw - 36px));z-index:1001;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.tp-sep{flex-basis:100%;font-size:10px;letter-spacing:2px;color:var(--muted);margin:4px 4px 0;text-align:right}
.tp-sep::before{content:'— ';color:var(--accent)}
.dock-theme{position:fixed;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(7,14px);gap:9px 8px;background:var(--panel-solid);border:1px solid var(--border);border-radius:12px;padding:9px 10px;z-index:1001;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.tp-btn{font-size:12px;font-family:inherit;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:999px;padding:5px 11px;cursor:pointer;letter-spacing:1px;transition:all .15s ease;white-space:nowrap}
.tp-btn:hover{color:var(--text);border-color:var(--border)}
.tp-btn.on{color:var(--accent);background:var(--tag-bg);border-color:var(--accent);font-weight:600}
.th-dot{width:14px;height:14px;border-radius:50%;cursor:pointer;border:1.5px solid rgba(127,127,127,.35);transition:transform .15s ease}
.th-dot:hover{transform:scale(1.18)}
.th-dot.on{border-color:var(--text)}
.th-dot[data-t="tech"]{background:#0ea5e9}
.th-dot[data-t="biz"]{background:#2563eb}

/* ═══ 入场动画 + 截图模式 + 响应式 ═══ */
.anim{animation:riseIn .55s ease both;opacity:0}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
html[data-shot] .anim{animation:none!important;opacity:1!important;transform:none!important}
html[data-shot] .dock-tpl,html[data-shot] .dock-theme{display:none!important}
@media (max-width:680px){
  .tpl-classic{width:86%}.tpl-classic ul.points{grid-template-columns:1fr}
  .tpl-magazine .cols{grid-template-columns:1fr;gap:28px}
  .tpl-dash{grid-template-columns:1fr;gap:36px}
  .tpl-grid .cards{grid-template-columns:1fr}
  .tpl-hero ul.points{flex-direction:column;gap:12px}
  .tp-btn{font-size:11px;padding:4px 8px}
  .dock-tpl{max-width:calc(100vw - 36px);flex-wrap:wrap;justify-content:flex-end}
  .dock-theme{grid-template-columns:repeat(5,14px)}
}
</style>

<script>
(function(){
  /* ═══════════ 数据区（生成海报时只替换此对象 + <title> + poster-id，其余一律不动） ═══════════ */
  var DATA = {
    tag: "ONE PAGER",
    title: "AI 改变工作",
    quote: "让机器做重复的事，让人做有温度的事",
    points: [
      { t: "重塑流程，把琐碎交给算法" },
      { t: "释放创造，把时间还给思考" },
      { t: "数据驱动，把决策交给证据" }
    ],
    footnote: "",
    kpi: "82%"
  };
  /* ═══════════ 十六套布局模板（只描述结构与类名，颜色一律走主题令牌；TPL_DIR 用户模板生成时并入 TPLS） ═══════════ */
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function N(i){ return String(i+1).padStart(2,'0'); }
  var F = 'GENERATED BY AI TEAM';
  var TPL = {
    classic: function(){
      var lis = DATA.points.map(function(p){ return '<li class="anim"><span class="dot"></span><span class="t">'+esc(p.t)+'</span></li>'; }).join('');
      return '<div class="tpl-classic">'
        + '<div class="badge anim">'+esc(DATA.tag)+'</div>'
        + '<h1 class="anim">'+esc(DATA.title)+'</h1>'
        + '<div class="divider anim"></div>'
        + '<div class="quote anim">'+esc(DATA.quote)+'</div>'
        + '<ul class="points anim">'+lis+'</ul>'
        + '<footer class="anim">'+F+'</footer>'
        + (DATA.footnote ? '<div class="footnote anim" style="font-size:11px;color:var(--muted);margin-top:8px">'+esc(DATA.footnote)+'</div>' : '')
        + '</div>';
    },
    minimal: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span><span class="t">'+esc(p.t)+'</span></li>'; }).join('');
      return '<div class="tpl-minimal">'
        + '<div class="badge anim">'+esc(DATA.tag)+'</div>'
        + '<h1 class="anim">'+esc(DATA.title)+'</h1>'
        + '<div class="rule anim"></div>'
        + '<div class="quote anim">'+esc(DATA.quote)+'</div>'
        + '<ol class="points anim">'+lis+'</ol>'
        + '<div class="meta anim"><span>'+F+'</span><span>'+esc(DATA.footnote||'')+'</span></div>'
        + '</div>';
    },
    magazine: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span><span class="t">'+esc(p.t)+'</span></li>'; }).join('');
      return '<div class="tpl-magazine">'
        + '<div class="masthead anim"><span>'+esc(DATA.tag)+'</span><span>ISSUE 01</span></div>'
        + '<div class="cols">'
        +   '<div><h1 class="anim">'+esc(DATA.title)+'</h1><div class="quote anim">'+esc(DATA.quote)+'</div></div>'
        +   '<ul class="points anim">'+lis+'</ul>'
        + '</div>'
        + '<div class="footbar anim"><span>'+F+'</span><span>'+esc(DATA.footnote||'')+'</span></div>'
        + '</div>';
    },
    hero: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span><span class="t">'+esc(p.t)+'</span></li>'; }).join('');
      return '<div class="tpl-hero">'
        + '<div class="badge anim">'+esc(DATA.tag)+'</div>'
        + '<h1 class="anim">'+esc(DATA.title)+'</h1>'
        + '<div class="quote anim">'+esc(DATA.quote)+'</div>'
        + '<ul class="points anim">'+lis+'</ul>'
        + '<footer class="anim">'+F+(DATA.footnote ? ' · '+esc(DATA.footnote) : '')+'</footer>'
        + '</div>';
    },
    timeline: function(){
      var rows = DATA.points.map(function(p,i){
        return '<div class="row"><div class="mid"><span class="dot anim"></span></div>'
          + '<div class="card anim"><span class="num">'+N(i)+'</span><span class="t">'+esc(p.t)+'</span></div></div>';
      }).join('');
      return '<div class="tpl-timeline">'
        + '<div class="head"><h1 class="anim">'+esc(DATA.title)+'</h1><div class="quote anim">'+esc(DATA.quote)+'</div></div>'
        + '<div class="track">'+rows+'</div>'
        + '<footer class="anim">'+F+(DATA.footnote ? ' · '+esc(DATA.footnote) : '')+'</footer>'
        + '</div>';
    },
    grid: function(){
      var cards = DATA.points.map(function(p,i){
        var w = (DATA.points.length === 5 && i === 4) ? ' wide' : '';
        return '<div class="card anim'+w+'"><span class="num">'+N(i)+'</span><span class="t">'+esc(p.t)+'</span></div>';
      }).join('');
      return '<div class="tpl-grid">'
        + '<div class="head"><h1 class="anim">'+esc(DATA.title)+'</h1><div class="quote anim">'+esc(DATA.quote)+'</div></div>'
        + '<div class="cards">'+cards+'</div>'
        + '<footer class="anim">'+F+(DATA.footnote ? ' · '+esc(DATA.footnote) : '')+'</footer>'
        + '</div>';
    },
    dashboard: function(){
      var pct = parseInt(String(DATA.kpi||'82%')) || 82;
      var first = DATA.points.slice(0,3);
      var rest = DATA.points.slice(3);
      var widths = [82,66,50];
      var bars = first.map(function(p,i){
        return '<div class="bar anim"><div class="row"><span class="t">'+esc(p.t)+'</span><span class="pct">'+widths[i]+'%</span></div>'
          + '<div class="track"><div class="fill" style="width:'+widths[i]+'%"></div></div></div>';
      }).join('');
      var extra = rest.map(function(p,i){
        return '<li class="anim"><span class="num">'+N(i+3)+'</span><span class="t">'+esc(p.t)+'</span></li>';
      }).join('');
      return '<div class="tpl-dash">'
        + '<div class="kpi">'
        +   '<div class="ring anim" style="background:conic-gradient(var(--accent) 0 '+pct+'%,var(--panel-solid) '+pct+'% 100%)"><span class="val">'+esc(DATA.kpi||'82%')+'</span><span class="lab">'+esc(DATA.tag)+'</span></div>'
        +   '<div class="bars">'+bars+'</div>'
        + '</div>'
        + '<div class="side">'
        +   '<h1 class="anim">'+esc(DATA.title)+'</h1>'
        +   '<div class="quote anim">'+esc(DATA.quote)+'</div>'
        +   (extra ? '<ul class="extra">'+extra+'</ul>' : '')
        +   '<div class="foot anim">'+F+(DATA.footnote ? ' · '+esc(DATA.footnote) : '')+'</div>'
        + '</div>'
        + '</div>';
    },
    brutalist: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span>'+esc(p.t)+'</li>'; }).join('');
      return '<div class="tpl-brutal">'
        + '<div class="badge anim">'+esc(DATA.tag)+'</div>'
        + '<h1 class="anim">'+esc(DATA.title)+'</h1>'
        + '<div class="quote anim">'+esc(DATA.quote)+'</div>'
        + '<ul class="points anim">'+lis+'</ul>'
        + '<footer class="anim"><span>'+F+'</span><span>'+esc(DATA.footnote||'')+'</span></footer>'
        + '</div>';
    },
    swiss: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span>'+esc(p.t)+'</li>'; }).join('');
      return '<div class="tpl-swiss">'
        + '<div class="badge anim">'+esc(DATA.tag)+'</div>'
        + '<h1 class="anim">'+esc(DATA.title)+'</h1>'
        + '<div class="rule anim"></div>'
        + '<div class="quote anim">'+esc(DATA.quote)+'</div>'
        + '<ul class="points anim">'+lis+'</ul>'
        + '<footer class="anim"><span>'+F+'</span><span>'+esc(DATA.footnote||'')+'</span></footer>'
        + '</div>';
    },
    bauhaus: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span>'+esc(p.t)+'</li>'; }).join('');
      return '<div class="tpl-bauhaus">'
        + '<div class="geo anim"><span class="c"></span><span class="s"></span><span class="t"></span></div>'
        + '<div class="badge anim">'+esc(DATA.tag)+'</div>'
        + '<h1 class="anim">'+esc(DATA.title)+'</h1>'
        + '<div class="quote anim">'+esc(DATA.quote)+'</div>'
        + '<ul class="points anim">'+lis+'</ul>'
        + '<div class="footbar anim"><span>'+F+'</span><span>'+esc(DATA.footnote||'')+'</span></div>'
        + '</div>';
    },
    mondrian: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span><span>'+esc(p.t)+'</span></li>'; }).join('');
      return '<div class="tpl-mondrian">'
        + '<div class="cell main"><div class="badge anim">'+esc(DATA.tag)+'</div><h1 class="anim">'+esc(DATA.title)+'</h1><div class="quote anim">'+esc(DATA.quote)+'</div></div>'
        + '<div class="cell side"><ul class="anim">'+lis+'</ul></div>'
        + '<div class="cell band anim"><span class="lab">'+F+'</span><span class="v">'+esc(DATA.footnote||'')+'</span></div>'
        + '</div>';
    },
    editorial: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span><span class="t">'+esc(p.t)+'</span></li>'; }).join('');
      return '<div class="tpl-editorial">'
        + '<div class="masthead anim"><span>'+esc(DATA.tag)+'</span><b>SPECIAL EDITION</b></div>'
        + '<div class="cols">'
        +   '<div><h1 class="anim">'+esc(DATA.title)+'</h1><div class="quote anim">'+esc(DATA.quote)+'</div></div>'
        +   '<ul class="points anim">'+lis+'</ul>'
        + '</div>'
        + '<div class="footbar anim"><span>'+F+'</span><span>'+esc(DATA.footnote||'')+'</span></div>'
        + '</div>';
    },
    typo: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span>'+esc(p.t)+'</li>'; }).join('');
      return '<div class="tpl-typo">'
        + '<div class="badge anim">'+esc(DATA.tag)+'</div>'
        + '<h1 class="anim">'+esc(DATA.title)+'</h1>'
        + '<div class="quote anim">'+esc(DATA.quote)+'</div>'
        + '<ul class="points anim">'+lis+'</ul>'
        + '<footer class="anim"><span>'+F+'</span><span>'+esc(DATA.footnote||'')+'</span></footer>'
        + '</div>';
    },
    memphis: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span><span>'+esc(p.t)+'</span></li>'; }).join('');
      return '<div class="tpl-memphis">'
        + '<div class="dots"></div>'
        + '<div class="badge anim">'+esc(DATA.tag)+'</div>'
        + '<h1 class="anim">'+esc(DATA.title)+'</h1>'
        + '<div class="quote anim">'+esc(DATA.quote)+'</div>'
        + '<ul class="points anim">'+lis+'</ul>'
        + '<footer class="anim"><span>'+F+'</span><span>'+esc(DATA.footnote||'')+'</span></footer>'
        + '</div>';
    },
    exhibit: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span>'+esc(p.t)+'</li>'; }).join('');
      return '<div class="tpl-exhibit">'
        + '<div class="wall-label anim">'+esc(DATA.tag)+'</div>'
        + '<div class="title-block"><h1 class="anim">'+esc(DATA.title)+'</h1><span class="yr anim">2026</span></div>'
        + '<div class="quote anim">'+esc(DATA.quote)+'</div>'
        + '<div class="label-card anim"><div class="lab">EXHIBIT NOTES</div><ul>'+lis+'</ul></div>'
        + '<footer class="anim"><span>'+F+'</span><span>'+esc(DATA.footnote||'')+'</span></footer>'
        + '</div>';
    },
    window: function(){
      var lis = DATA.points.map(function(p,i){ return '<li class="anim"><span class="num">'+N(i)+'</span>'+esc(p.t)+'</li>'; }).join('');
      return '<div class="tpl-window">'
        + '<div class="win w-main"><div class="badge anim">'+esc(DATA.tag)+'</div><h1 class="anim">'+esc(DATA.title)+'</h1><ul class="anim">'+lis+'</ul></div>'
        + '<div class="win w-top"><div class="k anim">'+esc(DATA.tag)+'</div><div class="v anim">'+esc(DATA.quote)+'</div></div>'
        + '<div class="win w-bottom"><div class="v anim">'+esc(DATA.footnote||'')+'</div><footer class="anim">'+F+'</footer></div>'
        + '</div>';
    }
  };

  /* ▼ 用户模板渲染函数内嵌点（TPL_DIR 模板的 TPL_FN 块插到本行之后，无用户模板则保持原样） */

  /* ═══════════ 页面 ID 自愈（沿用旧版机制） ═══════════ */
  var KEY = 'sf-heal:' + location.pathname;
  var m = document.querySelector('meta[name="poster-id"]');
  var ok = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(m ? m.content : '');
  var ID;
  if (ok) { ID = m.content; }
  else {
    var v = localStorage.getItem(KEY);
    if (!v) { v = crypto.randomUUID(); localStorage.setItem(KEY, v); }
    ID = v;
    m.setAttribute('content', v);
    console.warn('[poster] 非法 id meta 已自愈为 ' + v);
  }

  /* ═══════════ 主题换肤（十套配色） ═══════════ */
  var THEMES = ['tech','biz','mono','light','warm','ink','jade','rose','midnight','violet','swiss','bauhaus','memphis','morandi','nordic','artdeco','noir','classicblue','pop','retro','coral'];
  var THEME_KEY = 'poster:' + ID + '-theme';
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch(e) {}
  if (savedTheme && THEMES.indexOf(savedTheme) !== -1) document.documentElement.setAttribute('data-theme', savedTheme);
  var curT = document.documentElement.getAttribute('data-theme');
  if (THEMES.indexOf(curT) === -1) { curT = 'tech'; document.documentElement.setAttribute('data-theme', curT); }
  document.querySelectorAll('.th-dot').forEach(function(d){ d.classList.toggle('on', d.getAttribute('data-t') === curT); });
  document.querySelectorAll('.th-dot').forEach(function(d){
    d.addEventListener('click', function(){
      var t = d.getAttribute('data-t');
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem(THEME_KEY, t); } catch(e) {}
      document.querySelectorAll('.th-dot').forEach(function(x){ x.classList.toggle('on', x === d); });
    });
  });

  /* ═══════════ 模板切换（十六套布局随点随换，记忆上次选择） ═══════════ */
  var TPLS = ['classic','minimal','magazine','hero','timeline','grid','dashboard','brutalist','swiss','bauhaus','mondrian','editorial','typo','memphis','exhibit','window']; /* ▼ 用户模板 name 内嵌点：'window' 之后追加 ,'{name}'，无用户模板则保持原样 */
  var TPL_KEY = 'poster:' + ID + '-tpl';
  var savedTpl = null;
  try { savedTpl = localStorage.getItem(TPL_KEY); } catch(e) {}
  if (savedTpl && TPLS.indexOf(savedTpl) !== -1) document.documentElement.setAttribute('data-template', savedTpl);
  var curP = document.documentElement.getAttribute('data-template');
  if (TPLS.indexOf(curP) === -1) { curP = 'classic'; document.documentElement.setAttribute('data-template', curP); }

  function render(){
    var stage = document.getElementById('stage');
    stage.innerHTML = TPL[curP] ? TPL[curP]() : TPL.classic();
    var els = stage.querySelectorAll('.anim');
    els.forEach(function(e,i){ e.style.animationDelay = (i * 0.12) + 's'; });
    setTimeout(function(){ els.forEach(function(e){ e.style.opacity = '1'; e.style.transform = 'none'; }); }, 2000);
    fit();
  }
  document.querySelectorAll('.tp-btn').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-tpl') === curP);
    b.addEventListener('click', function(){
      curP = b.getAttribute('data-tpl');
      document.documentElement.setAttribute('data-template', curP);
      try { localStorage.setItem(TPL_KEY, curP); } catch(e) {}
      document.querySelectorAll('.tp-btn').forEach(function(x){ x.classList.toggle('on', x === b); });
      render();
    });
  });

  /* ═══════════ 一屏自适应缩放 + ?shot 截图模式 ═══════════ */
  function fit(){
    var stage = document.getElementById('stage');
    stage.style.transform = 'none';
    var scale = Math.min(1, window.innerHeight / (stage.scrollHeight + 1));
    if (scale < 1) { stage.style.transform = 'scale(' + scale + ')'; stage.style.transformOrigin = 'center center'; }
  }
  render();
  window.addEventListener('resize', fit);
  if (location.search.indexOf('shot') !== -1) {
    document.documentElement.setAttribute('data-shot', '1');
    var els = document.querySelectorAll('.anim');
    els.forEach(function(e){ e.style.opacity = '1'; e.style.transform = 'none'; e.style.animationDelay = '0s'; });
    fit();
  }
})();
</script>
</body>
</html>
