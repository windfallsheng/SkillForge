<!DOCTYPE html>
<html lang="zh-CN" data-theme="deepblue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="sf-template" content="one-pager@1">
<meta name="poster-id" content="REF-POSTER-0000">
<title>AI 改变工作 · 一页纸海报</title>
<style>
:root, [data-theme="deepblue"]{
  --bg:#071a2e; --bg2:#0d2b4a;
  --text:#e8f1fb; --muted:#8fb0cd;
  --accent:#38bdf8; --accent2:#0ea5e9;
  --grad:linear-gradient(135deg,#7dd3fc,#38bdf8,#0ea5e9);
  --glow:rgba(56,189,248,.3);
  --dot:linear-gradient(135deg,#38bdf8,#0ea5e9);
}
[data-theme="gold"]{
  --bg:#1c1208; --bg2:#2c1d0d;
  --text:#f7ecd9; --muted:#b39b7c;
  --accent:#e8b04b; --accent2:#d98a3d;
  --grad:linear-gradient(135deg,#f7d9a0,#e8b04b,#d98a3d);
  --glow:rgba(232,176,75,.3);
  --dot:linear-gradient(135deg,#e8b04b,#d98a3d);
}
[data-theme="mint"]{
  --bg:#0a1a12; --bg2:#12281c;
  --text:#e6f6ee; --muted:#8fb3a5;
  --accent:#34d399; --accent2:#10b981;
  --grad:linear-gradient(135deg,#6ee7b7,#34d399,#10b981);
  --glow:rgba(52,211,153,.3);
  --dot:linear-gradient(135deg,#34d399,#10b981);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,'Segoe UI',Roboto,sans-serif;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,var(--glow),transparent 60%)}
.stage{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:6vh 8vw;text-align:center;position:relative;z-index:1}
.badge{font-size:12px;letter-spacing:3px;color:var(--accent);margin-bottom:22px;animation:riseIn .5s ease backwards;animation-delay:0s}
h1{font-size:52px;line-height:1.25;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:18px;animation:riseIn .5s ease backwards;animation-delay:.13s;text-shadow:0 0 40px var(--glow)}
.divider{width:64px;height:2px;background:var(--grad);border-radius:2px;margin:0 auto 26px;animation:riseIn .5s ease backwards;animation-delay:.26s}
.quote{font-size:19px;font-style:italic;color:var(--text);max-width:640px;line-height:1.8;margin-bottom:40px;animation:riseIn .5s ease backwards;animation-delay:.39s}
.quote::before{content:"「";color:var(--accent)}
.quote::after{content:"」";color:var(--accent)}
.points{list-style:none;display:flex;flex-direction:column;gap:14px;margin-bottom:44px;animation:riseIn .5s ease backwards;animation-delay:.52s}
.points li{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--text)}
.points li .dot{width:9px;height:9px;border-radius:50%;background:var(--dot);box-shadow:0 0 12px var(--glow);flex:none}
footer{font-size:10px;color:var(--muted);letter-spacing:1px;animation:riseIn .5s ease backwards;animation-delay:.65s}
.footnote{font-size:11px;color:var(--muted);margin-top:8px}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.theme-dock{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;background:var(--bg2);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:7px 10px;z-index:9}
.th-dot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:1.5px solid transparent;transition:transform .15s ease}
.th-dot:hover{transform:scale(1.2)}
.th-dot[data-t="deepblue"]{background:linear-gradient(135deg,#38bdf8,#0ea5e9)}
.th-dot[data-t="gold"]{background:linear-gradient(135deg,#e8b04b,#d98a3d)}
.th-dot[data-t="mint"]{background:linear-gradient(135deg,#34d399,#10b981)}
.th-dot.on{border-color:var(--accent)}
@media (max-width:680px){h1{font-size:36px}.quote{font-size:16px}.points li{font-size:14px}}
html[data-shot] .stage>*{animation:none!important}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="badge">ONE PAGER</div>
  <h1>AI 改变工作</h1>
  <div class="divider"></div>
  <div class="quote">让机器做重复的事，让人做有温度的事</div>
  <ul class="points">
    <li><span class="dot"></span>重塑流程，把琐碎交给算法</li>
    <li><span class="dot"></span>释放创造，把时间还给思考</li>
    <li><span class="dot"></span>数据驱动，把决策交给证据</li>
  </ul>
  <footer>GENERATED BY AI TEAM</footer>
  <div class="footnote"></div>
</div>
<div class="theme-dock" id="dock">
  <span class="th-dot on" data-t="deepblue" title="深蓝"></span>
  <span class="th-dot" data-t="gold" title="暖金"></span>
  <span class="th-dot" data-t="mint" title="薄荷"></span>
</div>
<script>
(function(){
  var KEY = 'sf-heal:' + location.pathname;
  var m = document.querySelector('meta[name="poster-id"]');
  var ok = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(m ? m.content : '');
  var ID;
  if (ok) { ID = m.content; }
  else {
    var v = localStorage.getItem(KEY);
    if (!v) { v = crypto.randomUUID(); localStorage.setItem(KEY, v); }
    ID = v;
    m.setAttribute('content', v);
    console.warn('[poster] 非法 id meta 已自愈为 ' + v);
  }
  var THEME_KEY = 'poster:' + ID + '-theme';
  var savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  var cur = document.documentElement.getAttribute('data-theme');
  document.querySelectorAll('.th-dot').forEach(function(d){ d.classList.toggle('on', d.getAttribute('data-t') === cur); });
  document.querySelectorAll('.th-dot').forEach(function(d){
    d.addEventListener('click', function(){
      var t = d.getAttribute('data-t');
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem(THEME_KEY, t);
      document.querySelectorAll('.th-dot').forEach(function(x){ x.classList.toggle('on', x === d); });
    });
  });
  function fit(){
    var stage = document.getElementById('stage');
    var scale = Math.min(1, window.innerHeight / (stage.scrollHeight + 1));
    if (scale < 1) {
      stage.style.transform = 'scale(' + scale + ')';
      stage.style.transformOrigin = 'center center';
    }
  }
  fit();
  window.addEventListener('resize', fit);
  if (location.search.indexOf('shot') !== -1) {
    document.documentElement.setAttribute('data-shot', '1');
    document.querySelectorAll('.stage > *').forEach(function(c){ c.style.opacity = '1'; c.style.transform = 'none'; });
    document.getElementById('dock').style.display = 'none';
  }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; io.unobserve(e.target); } });
    }, {threshold:.1});
    document.querySelectorAll('.stage > *').forEach(function(c){ io.observe(c); });
    setTimeout(function(){ document.querySelectorAll('.stage > *').forEach(function(c){ c.style.opacity = '1'; c.style.transform = 'none'; }); }, 2000);
  }
})();
</script>
</body>
</html>
